<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Jobs | REPARO</title>

  <link rel="stylesheet" href="../css/reparo.css">

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 80px;
    }

    .page {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .page-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .page-subtitle {
      margin: 5px 0 0;
      color: #687386;
      font-size: 13px;
    }

    .logout-btn {
      border: 0;
      background: #fff;
      color: #e5395f;
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .summary-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(20,30,60,.07);
    }

    .summary-number {
      font-size: 23px;
      font-weight: 800;
      color: #18243a;
    }

    .summary-label {
      margin-top: 4px;
      color: #7a8495;
      font-size: 11px;
    }

    .search-box {
      background: #fff;
      border-radius: 15px;
      padding: 11px;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(20,30,60,.05);
    }

    .search-box input,
    .filter-box select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e1e5ed;
      background: #fafbfe;
      border-radius: 11px;
      padding: 12px;
      outline: none;
      font-size: 14px;
    }

    .filter-box {
      margin-bottom: 15px;
    }

    .job-card {
      background: #fff;
      border-radius: 18px;
      margin-bottom: 12px;
      padding: 15px;
      box-shadow: 0 6px 20px rgba(20,30,60,.07);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .job-id {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .customer-name {
      margin-top: 5px;
      font-size: 14px;
      color: #556176;
      font-weight: 600;
    }

    .status {
      white-space: nowrap;
      border-radius: 20px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
    }

    .status-new {
      background: #fff3c4;
      color: #8b6900;
    }

    .status-assigned {
      background: #e9f1ff;
      color: #2863c7;
    }

    .status-progress {
      background: #e9f1ff;
      color: #2863c7;
    }

    .status-diagnosis {
      background: #f0eaff;
      color: #6842c8;
    }

    .status-approval {
      background: #fff0d9;
      color: #b56a00;
    }

    .status-repair {
      background: #ffe9ef;
      color: #d82f58;
    }

    .status-completed {
      background: #e5f8ed;
      color: #16834a;
    }

    .status-cancelled {
      background: #f0f1f3;
      color: #747b87;
    }

    .job-info {
      margin-top: 13px;
    }

    .info-row {
      display: flex;
      gap: 9px;
      margin: 8px 0;
      font-size: 13px;
      color: #4e596c;
    }

    .info-icon {
      width: 20px;
      flex-shrink: 0;
    }

    .job-divider {
      height: 1px;
      background: #edf0f4;
      margin: 13px 0;
    }

    .job-actions {
      display: flex;
      justify-content: flex-end;
    }

    .view-btn {
      border: 0;
      background: #fff0f3;
      color: #d82f58;
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty,
    .loading {
      background: #fff;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      color: #70798a;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .empty-title {
      font-weight: 800;
      color: #273248;
      margin-bottom: 5px;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 11px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    #errorBox {
      background: #fff0f1;
      color: #c62845;
    }

    #successBox {
      background: #e8f8ef;
      color: #187a48;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,22,38,.55);
      z-index: 1000;
      padding: 18px;
      box-sizing: border-box;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 620px;
      max-height: 88vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 22px 22px 10px 10px;
      padding: 18px;
      box-sizing: border-box;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }

    .close-btn {
      border: 0;
      background: #f1f3f7;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .detail-section {
      margin-bottom: 15px;
      border: 1px solid #edf0f4;
      border-radius: 15px;
      padding: 13px;
    }

    .detail-title {
      font-size: 12px;
      font-weight: 800;
      color: #d82f58;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid #f1f2f5;
      font-size: 13px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: #7b8494;
    }

    .detail-value {
      color: #263146;
      font-weight: 700;
      text-align: right;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 65px;
      background: #fff;
      border-top: 1px solid #eceef3;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #7b8494;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .bottom-nav a.active {
      color: #d82f58;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    @media (min-width: 600px) {
      .page {
        padding: 24px;
      }

      .modal-backdrop {
        align-items: center;
      }

      .modal {
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="page-header">
      <div>
        <h1 class="page-title">My Jobs</h1>
        <p class="page-subtitle">Track your service jobs</p>
      </div>

      <button id="logoutBtn" class="logout-btn" type="button">
        Logout
      </button>
    </header>

    <div id="errorBox" class="message"></div>
    <div id="successBox" class="message"></div>

    <section class="summary-grid">
      <div class="summary-card">
        <div id="totalJobs" class="summary-number">0</div>
        <div class="summary-label">Total Jobs</div>
      </div>

      <div class="summary-card">
        <div id="activeJobs" class="summary-number">0</div>
        <div class="summary-label">Active</div>
      </div>

      <div class="summary-card">
        <div id="completedJobs" class="summary-number">0</div>
        <div class="summary-label">Completed</div>
      </div>
    </section>

    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="Search Job, Customer, Mobile, Device..."
        autocomplete="off"
      >
    </div>

    <div class="filter-box">
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="NEW">New</option>
        <option value="ASSIGNED">Assigned</option>
        <option value="IN PROGRESS">In Progress</option>
        <option value="DIAGNOSIS">Diagnosis</option>
        <option value="CUSTOMER APPROVAL">Customer Approval</option>
        <option value="REPAIR">Repair</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>

    <section id="jobContainer">
      <div class="loading">Loading jobs...</div>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="./dashboard.html">
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a href="./new-service-request.html">
      <span class="nav-icon">＋</span>
      Request
    </a>

    <a href="./customers.html">
      <span class="nav-icon">👥</span>
      Customers
    </a>

    <a href="./jobs.html" class="active">
      <span class="nav-icon">🔧</span>
      Jobs
    </a>

    <a href="./earnings.html">
      <span class="nav-icon">₹</span>
      Earnings
    </a>
  </nav>

  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Job Details</h2>

        <button
          id="closeModalBtn"
          class="close-btn"
          type="button"
        >
          ×
        </button>
      </div>

      <div id="modalContent"></div>

    </div>

  </div>

  <script
    type="module"
    src="../js/retailer-jobs.js"
  ></script>

</body>
</html>
