<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invoice | REPARO</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 12px;
      color: #7b8494;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }

    .back-btn {
      background: #fff;
      color: #d82f58;
      padding: 9px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(20,30,60,.06);
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .invoice-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      color: #d82f58;
    }

    .invoice-label {
      color: #7b8494;
      font-size: 11px;
      margin-top: 4px;
    }

    .invoice-id {
      text-align: right;
      font-size: 12px;
      font-weight: 800;
    }

    .date {
      color: #7b8494;
      font-size: 11px;
      margin-top: 4px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f2f5;
      font-size: 13px;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      color: #7b8494;
    }

    .value {
      font-weight: 700;
      text-align: right;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 13px;
      border-top: 2px solid #edf0f4;
      font-size: 18px;
      font-weight: 900;
    }

    .total span:last-child {
      color: #d82f58;
    }

    .warranty {
      background: #fff8e8;
      color: #765900;
    }

    .warranty h2 {
      color: #8b6200;
    }

    .warranty-status {
      display: inline-block;
      margin-top: 5px;
      padding: 7px 11px;
      border-radius: 20px;
      background: #e8f8ef;
      color: #187a48;
      font-size: 11px;
      font-weight: 800;
    }

    .expired {
      background: #f0f1f3;
      color: #68707d;
    }

    .paid {
      display: inline-block;
      background: #e8f8ef;
      color: #187a48;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    .pending {
      display: inline-block;
      background: #fff3c4;
      color: #8b6900;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    .loading,
    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      color: #70798a;
    }

    .empty-title {
      color: #273248;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .print-btn {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      background: #d82f58;
      color: #fff;
      font-size: 14px;
    }

    @media print {
      body {
        background: #fff;
      }

      .topbar,
      .print-btn {
        display: none !important;
      }

      .card {
        box-shadow: none;
        border: 1px solid #ddd;
      }

      .page {
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">
      <div>
        <h1 class="title">Invoice</h1>
        <div class="subtitle">REPARO Service Invoice</div>
      </div>

      <button
        id="backBtn"
        class="back-btn"
        type="button"
      >
        ← Status
      </button>
    </header>


    <section id="invoiceContainer">

      <div class="loading">
        Loading invoice...
      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/customer-invoice.js"
  ></script>

</body>
</html>
