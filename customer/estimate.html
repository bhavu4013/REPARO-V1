<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Repair Estimate | REPARO</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .page {
      max-width: 620px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back-btn {
      border: 0;
      background: #fff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20,30,60,.06);
    }

    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #7b8494;
      font-size: 12px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 13px;
      font-size: 13px;
      font-weight: 600;
    }

    #errorBox {
      background: #fff0f1;
      color: #c62845;
    }

    #successBox {
      background: #e8f8ef;
      color: #187a48;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .card-title {
      margin: 0 0 13px;
      font-size: 15px;
      font-weight: 800;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .job-id {
      font-size: 14px;
      font-weight: 800;
    }

    .status {
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-approval {
      background: #fff0d9;
      color: #b56a00;
    }

    .status-approved {
      background: #e5f8ed;
      color: #16834a;
    }

    .status-rejected {
      background: #fff0f1;
      color: #c62845;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f2f5;
      font-size: 13px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: #7b8494;
    }

    .info-value {
      color: #263146;
      font-weight: 700;
      text-align: right;
      max-width: 65%;
    }

    .amount-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f2f5;
      font-size: 14px;
    }

    .amount-row:last-child {
      border-bottom: 0;
    }

    .amount-label {
      color: #626d80;
    }

    .amount-value {
      font-weight: 700;
    }

    .total-row {
      margin-top: 8px;
      padding: 14px;
      background: #fff0f3;
      border-radius: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      color: #795362;
      font-size: 13px;
      font-weight: 700;
    }

    .total-value {
      color: #d82f58;
      font-size: 23px;
      font-weight: 800;
    }

    .approval-box {
      padding: 13px;
      border-radius: 13px;
      background: #fff8e8;
      color: #8b6200;
      font-size: 13px;
      line-height: 1.5;
    }

    .approval-box.approved {
      background: #e8f8ef;
      color: #187a48;
    }

    .approval-box.rejected {
      background: #fff0f1;
      color: #c62845;
    }

    .action-area {
      margin-top: 16px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 9px;
    }

    .approve-btn {
      background: #d82f58;
      color: #fff;
    }

    .reject-btn {
      background: #fff;
      color: #d82f58;
      border: 1px solid #efc4cf;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .loading {
      background: #fff;
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: #70798a;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="topbar">

      <button
        id="backBtn"
        class="back-btn"
        type="button"
      >
        ‹
      </button>

      <div>
        <h1 class="title">
          Repair Estimate
        </h1>

        <div
          id="headerJobId"
          class="subtitle"
        >
          Loading...
        </div>
      </div>

    </div>


    <div
      id="errorBox"
      class="message"
    ></div>

    <div
      id="successBox"
      class="message"
    ></div>


    <section id="content">

      <div class="loading">
        Loading estimate...
      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/customer-estimate.js"
  ></script>

</body>
</html>
