<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Service History | REPARO</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 12px;
      color: #7b8494;
    }

    .back-btn {
      border: 0;
      background: #fff;
      color: #d82f58;
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20,30,60,.06);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 13px;
    }

    .summary-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .summary-label {
      color: #7b8494;
      font-size: 11px;
    }

    .summary-value {
      margin-top: 5px;
      font-size: 21px;
      font-weight: 900;
      color: #d82f58;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .job-id {
      font-size: 14px;
      font-weight: 900;
    }

    .job-date {
      margin-top: 4px;
      color: #7b8494;
      font-size: 11px;
    }

    .status {
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .completed {
      background: #e8f8ef;
      color: #187a48;
    }

    .cancelled {
      background: #f0f1f3;
      color: #747b87;
    }

    .other {
      background: #e9f1ff;
      color: #2863c7;
    }

    .device {
      margin-top: 13px;
      font-size: 14px;
      font-weight: 800;
    }

    .service {
      margin-top: 5px;
      color: #7b8494;
      font-size: 12px;
    }

    .amount {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid #edf0f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount-label {
      color: #7b8494;
      font-size: 11px;
    }

    .amount-value {
      color: #d82f58;
      font-size: 16px;
      font-weight: 900;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .action-btn {
      border: 0;
      padding: 11px;
      border-radius: 12px;
      background: #fff0f3;
      color: #d82f58;
      font-weight: 800;
      cursor: pointer;
    }

    .action-btn.primary {
      background: #d82f58;
      color: #fff;
    }

    .loading,
    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 38px 20px;
      text-align: center;
      color: #70798a;
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .empty-title {
      color: #273248;
      font-weight: 800;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">
      <div>
        <h1 class="title">Service History</h1>
        <div class="subtitle">
          Your previous REPARO services
        </div>
      </div>

      <button
        id="backBtn"
        class="back-btn"
        type="button"
      >
        ← Status
      </button>
    </header>


    <section class="summary">

      <div class="summary-card">
        <div class="summary-label">
          Total Services
        </div>

        <div
          id="totalCount"
          class="summary-value"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Completed
        </div>

        <div
          id="completedCount"
          class="summary-value"
        >
          0
        </div>
      </div>

    </section>


    <section id="historyContainer">

      <div class="loading">
        Loading service history...
      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/customer-history.js"
  ></script>

</body>
</html>
