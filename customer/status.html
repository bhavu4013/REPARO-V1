<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Service Status | REPARO</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #7b8494;
      font-size: 12px;
    }

    .logout-btn,
    .back-btn {
      border: 0;
      background: #fff;
      border-radius: 12px;
      padding: 9px 12px;
      color: #d82f58;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20,30,60,.06);
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 13px;
      font-size: 13px;
      font-weight: 600;
    }

    #errorBox {
      background: #fff0f1;
      color: #c62845;
    }

    #successBox {
      background: #e8f8ef;
      color: #187a48;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .job-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .job-id {
      font-size: 14px;
      font-weight: 800;
    }

    .job-date {
      margin-top: 5px;
      color: #818a99;
      font-size: 11px;
    }

    .status {
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-new {
      background: #fff3c4;
      color: #8b6900;
    }

    .status-assigned,
    .status-progress {
      background: #e9f1ff;
      color: #2863c7;
    }

    .status-diagnosis {
      background: #f0eaff;
      color: #6842c8;
    }

    .status-approval {
      background: #fff0d9;
      color: #b56a00;
    }

    .status-repair {
      background: #ffe9ef;
      color: #d82f58;
    }

    .status-completed {
      background: #e5f8ed;
      color: #16834a;
    }

    .status-cancelled {
      background: #f0f1f3;
      color: #747b87;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f2f5;
      font-size: 13px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: #7b8494;
    }

    .info-value {
      color: #263146;
      font-weight: 700;
      text-align: right;
      max-width: 65%;
    }

    .timeline {
      position: relative;
      margin-top: 8px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: #e8ebf0;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 12px;
      margin-bottom: 17px;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: relative;
      z-index: 2;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e8ebf0;
      flex-shrink: 0;
      box-sizing: border-box;
      border: 4px solid #fff;
    }

    .timeline-item.done .timeline-dot {
      background: #d82f58;
    }

    .timeline-item.current .timeline-dot {
      background: #f4b400;
    }

    .timeline-content {
      padding-top: 2px;
    }

    .timeline-title {
      font-size: 13px;
      font-weight: 800;
    }

    .timeline-text {
      margin-top: 3px;
      color: #7b8494;
      font-size: 11px;
      line-height: 1.4;
    }

    .approval-card {
      background: #fff8e8;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 13px;
    }

    .approval-card h3 {
      margin: 0 0 6px;
      color: #8b6200;
      font-size: 14px;
    }

    .approval-card p {
      margin: 0;
      color: #806318;
      font-size: 12px;
      line-height: 1.5;
    }

    .estimate-btn {
      width: 100%;
      border: 0;
      background: #d82f58;
      color: #fff;
      border-radius: 13px;
      padding: 13px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    .estimate-btn.secondary {
      background: #fff0f3;
      color: #d82f58;
    }

    .loading {
      background: #fff;
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: #70798a;
    }

    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      color: #70798a;
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .empty-title {
      color: #273248;
      font-weight: 800;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">

      <div>
        <h1 class="title">
          Service Status
        </h1>

        <div class="subtitle">
          Track your REPARO service
        </div>
      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        Logout
      </button>

    </header>


    <div
      id="errorBox"
      class="message"
    ></div>

    <div
      id="successBox"
      class="message"
    ></div>


    <section id="statusContainer">

      <div class="loading">
        Loading service status...
      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/customer-status.js"
  ></script>

</body>
</html>
