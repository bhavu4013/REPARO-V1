<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support | REPARO</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 12px;
      color: #7b8494;
    }

    .back-btn {
      border: 0;
      background: #fff;
      color: #d82f58;
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20,30,60,.06);
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .section-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 800;
    }

    .section-text {
      margin: 0 0 14px;
      color: #7b8494;
      font-size: 12px;
      line-height: 1.5;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .contact-btn {
      border: 0;
      border-radius: 14px;
      padding: 14px 10px;
      background: #fff0f3;
      color: #d82f58;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
    }

    .contact-btn.blue {
      background: #e9f1ff;
      color: #2863c7;
    }

    .contact-btn.yellow {
      background: #fff6d8;
      color: #8b6900;
    }

    .contact-icon {
      display: block;
      font-size: 23px;
      margin-bottom: 7px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #4e586b;
      font-size: 12px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e1e5eb;
      background: #fafbfc;
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d82f58;
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #d82f58;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .success {
      display: none;
      margin-bottom: 13px;
      padding: 13px;
      border-radius: 13px;
      background: #e8f8ef;
      color: #187a48;
      font-size: 12px;
      font-weight: 700;
    }

    .error {
      display: none;
      margin-bottom: 13px;
      padding: 13px;
      border-radius: 13px;
      background: #fff0f1;
      color: #c62845;
      font-size: 12px;
      font-weight: 700;
    }

    .note {
      color: #7b8494;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">

      <div>
        <h1 class="title">Support</h1>

        <div class="subtitle">
          REPARO Customer Support
        </div>
      </div>

      <button
        id="backBtn"
        class="back-btn"
        type="button"
      >
        ← Status
      </button>

    </header>


    <div
      id="successBox"
      class="success"
    ></div>


    <div
      id="errorBox"
      class="error"
    ></div>


    <section class="card">

      <h2 class="section-title">
        Need Help?
      </h2>

      <p class="section-text">
        Contact REPARO for service, estimate,
        invoice, warranty or technician-related help.
      </p>


      <div class="contact-grid">

        <button
          id="callBtn"
          class="contact-btn"
          type="button"
        >
          <span class="contact-icon">📞</span>
          Call Support
        </button>


        <button
          id="whatsappBtn"
          class="contact-btn blue"
          type="button"
        >
          <span class="contact-icon">💬</span>
          WhatsApp
        </button>

      </div>

    </section>


    <section class="card">

      <h2 class="section-title">
        Send a Support Request
      </h2>

      <p class="section-text">
        Tell us what you need help with.
      </p>


      <form id="supportForm">

        <label for="category">
          Support Type
        </label>

        <select
          id="category"
          required
        >
          <option value="">
            Select support type
          </option>

          <option value="SERVICE">
            Service / Repair
          </option>

          <option value="ESTIMATE">
            Estimate / Approval
          </option>

          <option value="INVOICE">
            Invoice / Payment
          </option>

          <option value="WARRANTY">
            Warranty
          </option>

          <option value="TECHNICIAN">
            Technician
          </option>

          <option value="OTHER">
            Other
          </option>
        </select>


        <label for="jobId">
          Service Job ID (Optional)
        </label>

        <input
          id="jobId"
          type="text"
          placeholder="Example: JOB-1001"
        />


        <label for="message">
          Message
        </label>

        <textarea
          id="message"
          placeholder="Describe your issue..."
          required
        ></textarea>


        <button
          id="submitBtn"
          class="submit-btn"
          type="submit"
        >
          Send Support Request
        </button>

      </form>


      <div class="note">
        Your support request will be associated with
        your customer account.
      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/customer-support.js"
  ></script>

</body>
</html>
