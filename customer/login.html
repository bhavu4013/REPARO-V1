<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Login | REPARO</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 31px;
      font-weight: 900;
      color: #d82f58;
      margin-bottom: 5px;
    }

    .tagline {
      text-align: center;
      color: #7b8494;
      font-size: 12px;
      margin-bottom: 22px;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(20,30,60,.08);
    }

    .title {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
    }

    .subtitle {
      margin: 6px 0 20px;
      color: #7b8494;
      font-size: 12px;
      line-height: 1.5;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 13px;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
    }

    .error {
      background: #fff0f1;
      color: #c62845;
    }

    .success {
      background: #e8f8ef;
      color: #187a48;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #4e586b;
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e1e5eb;
      background: #fafbfc;
      border-radius: 13px;
      padding: 13px;
      margin-bottom: 14px;
      outline: none;
      font-family: inherit;
      font-size: 13px;
    }

    input:focus {
      border-color: #d82f58;
      background: #fff;
    }

    .login-btn {
      width: 100%;
      border: 0;
      background: #d82f58;
      color: #fff;
      border-radius: 13px;
      padding: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #7b8494;
      margin-top: 15px;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .info {
      margin-top: 18px;
      padding: 12px;
      background: #e9f1ff;
      color: #2863c7;
      border-radius: 13px;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
      REPARO
    </div>

    <div class="tagline">
      Electronics Service & Repair
    </div>


    <section class="card">

      <h1 class="title">
        Customer Login
      </h1>

      <p class="subtitle">
        Login to track your service, approve estimates,
        view invoices and check warranty information.
      </p>


      <div
        id="errorBox"
        class="message error"
      ></div>


      <div
        id="successBox"
        class="message success"
      ></div>


      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required
        />


        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        />


        <button
          id="loginBtn"
          class="login-btn"
          type="submit"
        >
          Login
        </button>

      </form>


      <button
        id="backBtn"
        class="back-btn"
        type="button"
      >
        ← Back to Main Login
      </button>


      <div class="info">
        Use the email and password provided for your
        REPARO customer account.
      </div>

    </section>

  </main>


  <script
    type="module"
    src="../js/customer-login.js"
  ></script>

</body>
</html>
