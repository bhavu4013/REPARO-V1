<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customers | REPARO V1</title>

  <link rel="stylesheet" href="../css/reparo.css">

  <style>
    body {
      background: #f7f8fa;
    }

    .page {
      max-width: 760px;
      margin: auto;
      padding: 16px 14px 90px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      color: #111827;
      font-size: 22px;
    }

    .header p {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 11px;
    }

    .add-btn {
      border: 0;
      background: #f9547c;
      color: #fff;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: #fff;
      border-radius: 16px;
      padding: 13px 10px;
      box-shadow: 0 5px 18px rgba(17,24,39,.06);
    }

    .summary-card span {
      display: block;
      color: #6b7280;
      font-size: 9px;
      margin-bottom: 5px;
    }

    .summary-card strong {
      color: #111827;
      font-size: 19px;
    }

    .toolbar {
      background: #fff;
      padding: 12px;
      border-radius: 17px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(17,24,39,.05);
    }

    .search {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      font-size: 12px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .filter {
      flex: 1;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 11px;
      padding: 9px;
      font-size: 11px;
      color: #374151;
    }

    .customer-card {
      background: #fff;
      border-radius: 19px;
      padding: 15px;
      margin-bottom: 11px;
      box-shadow: 0 5px 20px rgba(17,24,39,.06);
      cursor: pointer;
    }

    .customer-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .customer-name {
      color: #111827;
      font-size: 15px;
      font-weight: 800;
    }

    .customer-mobile {
      color: #6b7280;
      font-size: 11px;
      margin-top: 4px;
    }

    .status {
      align-self: flex-start;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 8px;
      font-weight: 800;
    }

    .active {
      background: #e8f8f0;
      color: #16734b;
    }

    .inactive {
      background: #f3f4f6;
      color: #6b7280;
    }

    .customer-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .info {
      background: #f6f8fb;
      border-radius: 11px;
      padding: 9px;
    }

    .info span {
      display: block;
      color: #6b7280;
      font-size: 8px;
      margin-bottom: 4px;
    }

    .info strong {
      color: #111827;
      font-size: 10px;
      word-break: break-word;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #6b7280;
      font-size: 12px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 700px;
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 18px;
      box-sizing: border-box;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
      color: #111827;
    }

    .close-btn {
      border: 0;
      background: #f3f4f6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      color: #374151;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 11px;
      padding: 11px;
      font-size: 12px;
      outline: none;
    }

    .field textarea {
      min-height: 70px;
      resize: vertical;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .protected-box {
      background: #fff4cc;
      color: #705600;
      border-radius: 12px;
      padding: 11px;
      font-size: 10px;
      line-height: 1.5;
      margin-bottom: 13px;
    }

    .save-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #f9547c;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    .detail-section {
      background: #f6f8fb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .detail-section h3 {
      margin: 0 0 9px;
      font-size: 12px;
      color: #111827;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      font-size: 10px;
    }

    .detail-row span {
      color: #6b7280;
    }

    .detail-row strong {
      color: #111827;
      text-align: right;
    }

    @media (min-width: 600px) {
      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-box {
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

<main class="page">

  <header class="header">
    <div>
      <h1>Customers</h1>
      <p>Customer relationship & protection management</p>
    </div>

    <button
      id="addBtn"
      class="add-btn">
      + Add Customer
    </button>
  </header>


  <section class="summary">

    <div class="summary-card">
      <span>TOTAL</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="summary-card">
      <span>ACTIVE</span>
      <strong id="activeCount">0</strong>
    </div>

    <div class="summary-card">
      <span>PROTECTED</span>
      <strong id="protectedCount">0</strong>
    </div>

  </section>


  <section class="toolbar">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search customer, mobile, email...">

    <div class="filter-row">

      <select
        id="statusFilter"
        class="filter">

        <option value="ALL">
          All Status
        </option>

        <option value="ACTIVE">
          Active
        </option>

        <option value="INACTIVE">
          Inactive
        </option>

      </select>


      <select
        id="retailerFilter"
        class="filter">

        <option value="ALL">
          All Retailers
        </option>

      </select>

    </div>

  </section>


  <div id="loading" class="loading">
    Loading customers...
  </div>

  <div
    id="customerList"
    style="display:none;">
  </div>

</main>


<!-- =====================================================
     CUSTOMER MODAL
===================================================== -->

<div
  id="customerModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Customer
      </h2>

      <button
        id="closeModal"
        class="close-btn">
        ×
      </button>

    </div>


    <div class="protected-box">
      <strong>Customer Protection:</strong>
      The selected retailer becomes the original
      service relationship owner. Customer transfer
      remains Admin-only.
    </div>


    <form id="customerForm">

      <div class="form-grid">

        <div class="field">
          <label>FULL NAME *</label>

          <input
            id="name"
            required
            placeholder="Customer name">
        </div>


        <div class="field">
          <label>MOBILE *</label>

          <input
            id="mobile"
            required
            type="tel"
            placeholder="10 digit mobile">
        </div>


        <div class="field">
          <label>EMAIL</label>

          <input
            id="email"
            type="email"
            placeholder="Customer email">
        </div>


        <div class="field">
          <label>STATUS</label>

          <select id="active">
            <option value="true">
              Active
            </option>

            <option value="false">
              Inactive
            </option>
          </select>
        </div>


        <div class="field full">
          <label>ORIGINAL RETAILER *</label>

          <select
            id="retailerId"
            required>

            <option value="">
              Select retailer
            </option>

          </select>
        </div>


        <div class="field full">
          <label>ADDRESS</label>

          <textarea
            id="address"
            placeholder="Customer address">
          </textarea>
        </div>


        <div class="field">
          <label>CITY</label>

          <input
            id="city"
            placeholder="City">
        </div>


        <div class="field">
          <label>PINCODE</label>

          <input
            id="pincode"
            placeholder="Pincode">
        </div>


        <div class="field full">
          <label>AUTH USER ID</label>

          <input
            id="authUserId"
            placeholder="Firebase Auth UID (optional)">
        </div>

      </div>


      <button
        id="saveBtn"
        class="save-btn"
        type="submit">

        Save Customer

      </button>

    </form>

  </div>

</div>


<!-- =====================================================
     DETAIL MODAL
===================================================== -->

<div
  id="detailModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Customer Details
      </h2>

      <button
        id="closeDetail"
        class="close-btn">
        ×
      </button>

    </div>

    <div id="detailContent"></div>

  </div>

</div>


<script
  type="module"
  src="../js/customers.js">
</script>

</body>
</html>
