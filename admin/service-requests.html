<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>REPARO V1 - Service Requests</title>

  <style>
    :root {
      --pink: #f9547c;
      --yellow: #ffe32b;
      --blue: #08aee0;
      --navy: #172033;
      --muted: #737987;
      --bg: #f6f7fb;
      --border: #e4e6eb;
      --green: #18a558;
      --red: #dc3545;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 86px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    .topbar {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 15px 18px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 900;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
    }

    .logout {
      border: 0;
      border-radius: 22px;
      background: #f1f3f6;
      color: var(--navy);
      padding: 10px 17px;
      font-size: 13px;
      font-weight: 800;
    }

    /* ================= MAIN ================= */

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 16px 30px;
    }

    /* ================= PAGE HEADER ================= */

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .page-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .page-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.3;
    }

    .new-btn {
      flex: 0 0 auto;
      border: 0;
      background: var(--blue);
      color: #fff;
      border-radius: 19px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(8, 174, 224, .18);
    }

    .new-btn:active {
      transform: scale(.98);
    }

    /* ================= MESSAGE ================= */

    .message {
      display: none;
      border-radius: 15px;
      padding: 13px 15px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    /* ================= SUMMARY ================= */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: #fff;
      border-radius: 24px;
      padding: 22px 27px;
      min-height: 140px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, .045);
    }

    .summary-label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .summary-value {
      font-size: 31px;
      line-height: 1;
      font-weight: 900;
    }

    /* ================= FILTER ================= */

    .filter-section {
      margin-bottom: 18px;
    }

    .search-input,
    .status-select {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 19px;
      padding: 16px 24px;
      outline: none;
      color: var(--navy);
      font-size: 15px;
    }

    .search-input {
      margin-bottom: 10px;
    }

    .search-input::placeholder {
      color: #777;
    }

    .search-input:focus,
    .status-select:focus {
      border-color: var(--blue);
    }

    /* ================= REQUEST LIST ================= */

    .request-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .request-card {
      background: #fff;
      border-radius: 23px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, .05);
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .request-id {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      word-break: break-word;
    }

    .customer {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-new {
      background: #ffe3eb;
      color: #c72554;
    }

    .status-contacted {
      background: #e0f7fd;
      color: #08779a;
    }

    .status-accepted {
      background: #fff1b8;
      color: #735d00;
    }

    .status-assigned {
      background: #e5ddff;
      color: #6335a5;
    }

    .status-job {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .request-info {
      display: grid;
      gap: 9px;
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.4;
    }

    .info-icon {
      width: 21px;
      flex: 0 0 21px;
      text-align: center;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 15px 0;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    .action {
      flex: 1;
      border: 0;
      border-radius: 13px;
      padding: 11px;
      font-size: 13px;
      font-weight: 800;
    }

    .view {
      background: #dff5fc;
      color: #08779a;
    }

    .job {
      background: #fff2a8;
      color: #5d5100;
    }

    /* ================= EMPTY / LOADING ================= */

    .empty,
    .loading {
      background: #fff;
      border-radius: 23px;
      min-height: 190px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 6px 20px rgba(15, 23, 42, .04);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 900;
    }

    .empty-text {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .loading {
      color: var(--muted);
      font-size: 15px;
    }

    /* ================= MODAL ================= */

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-bg.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: 100%;
      max-width: 580px;
      background: #fff;
      border-radius: 27px;
      padding: 20px;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
    }

    .close {
      width: 39px;
      height: 39px;
      flex: 0 0 39px;
      border: 0;
      border-radius: 50%;
      background: #f1f3f6;
      font-size: 23px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin: 0 0 6px 3px;
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafbfc;
      padding: 13px;
      outline: none;
      color: var(--navy);
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 9px;
      margin-top: 18px;
    }

    .modal-btn {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 13px;
      font-weight: 900;
    }

    .cancel {
      background: #f1f3f6;
      color: #374151;
    }

    .save {
      background: var(--blue);
      color: #fff;
    }

    /* ================= MORE PANEL ================= */

    .more-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .25);
      z-index: 70;
    }

    .more-overlay.show {
      display: block;
    }

    .more-panel {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 76px;
      background: #fff;
      border-radius: 25px 25px 0 0;
      padding: 20px 16px 18px;
      box-shadow: 0 -12px 35px rgba(15,23,42,.14);
      z-index: 80;
    }

    .more-panel.show {
      display: block;
    }

    .more-title {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 900;
    }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .more-item {
      text-decoration: none;
      color: var(--navy);
      background: #f7f8fa;
      border-radius: 15px;
      padding: 12px 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
    }

    .more-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 5px;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 90;
    }

    .nav-item {
      flex: 1;
      min-width: 0;
      border: 0;
      background: #fff;
      text-decoration: none;
      color: #737987;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-item.active {
      color: var(--pink);
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 620px) {

      main {
        padding: 18px 0 28px;
      }

      .page-head {
        padding: 0 16px;
        align-items: flex-start;
      }

      .page-title {
        font-size: 31px;
      }

      .page-subtitle {
        font-size: 14px;
      }

      .new-btn {
        padding: 14px 15px;
        font-size: 14px;
      }

      .summary {
        padding: 0;
        gap: 10px;
      }

      .summary-card {
        border-radius: 24px;
        padding: 21px 27px;
        min-height: 140px;
      }

      .filter-section {
        padding: 0;
      }

      .search-input,
      .status-select {
        border-radius: 19px;
      }

      .request-list {
        padding: 0 0;
      }

      .request-card,
      .empty,
      .loading {
        border-radius: 23px;
      }

      .more-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 430px) {

      .page-head {
        gap: 10px;
      }

      .page-title {
        font-size: 29px;
      }

      .new-btn {
        font-size: 13px;
        padding: 13px 12px;
      }

      .summary-card {
        padding: 20px 25px;
      }

      .summary-value {
        font-size: 29px;
      }
    }

    @media (max-width: 360px) {

      .page-title {
        font-size: 27px;
      }

      .new-btn {
        padding: 12px 10px;
      }

      .more-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <div class="brand-row">

      <div class="brand">

        <div class="logo">
          R
        </div>

        <span>REPARO</span>

      </div>


      <button
        id="logoutBtn"
        class="logout"
        type="button"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main>

    <div class="page-head">

      <div class="page-title-wrap">

        <h1 class="page-title">
          Service Requests
        </h1>

        <p class="page-subtitle">
          Manage retailer service requests
        </p>

      </div>


      <button
        id="newRequestBtn"
        class="new-btn"
        type="button"
      >
        + New Request
      </button>

    </div>


    <div
      id="errorBox"
      class="message error"
    ></div>


    <div
      id="successBox"
      class="message success"
    ></div>


    <!-- SUMMARY -->

    <section class="summary">

      <div class="summary-card">

        <div class="summary-label">
          Total
        </div>

        <div
          id="totalCount"
          class="summary-value"
        >
          0
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          New
        </div>

        <div
          id="newCount"
          class="summary-value"
        >
          0
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          Jobs
        </div>

        <div
          id="jobCount"
          class="summary-value"
        >
          0
        </div>

      </div>

    </section>


    <!-- FILTER -->

    <section class="filter-section">

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search customer, mobile, request ID..."
      >


      <select
        id="statusFilter"
        class="status-select"
      >

        <option value="">
          All Status
        </option>

        <option value="NEW">
          New
        </option>

        <option value="CONTACTED">
          Contacted
        </option>

        <option value="ACCEPTED">
          Accepted
        </option>

        <option value="ASSIGNED">
          Assigned
        </option>

        <option value="CONVERTED TO JOB">
          Converted to Job
        </option>

        <option value="CANCELLED">
          Cancelled
        </option>

      </select>

    </section>


    <!-- REQUESTS -->

    <section id="requestContainer">

      <div class="loading">
        Loading service requests...
      </div>

    </section>

  </main>


  <!-- MORE OVERLAY -->

  <div
    id="moreOverlay"
    class="more-overlay"
  ></div>


  <!-- MORE PANEL -->

  <section
    id="morePanel"
    class="more-panel"
  >

    <h3 class="more-title">
      More
    </h3>


    <div class="more-grid">

      <a
        class="more-item"
        href="./retailers.html"
      >
        <span class="more-icon">🏪</span>
        Retailers
      </a>


      <a
        class="more-item"
        href="./technicians.html"
      >
        <span class="more-icon">🔧</span>
        Technicians
      </a>


      <a
        class="more-item"
        href="./customers.html"
      >
        <span class="more-icon">👤</span>
        Customers
      </a>


      <a
        class="more-item"
        href="./earnings.html"
      >
        <span class="more-icon">₹</span>
        Earnings
      </a>


      <a
        class="more-item"
        href="./warranty.html"
      >
        <span class="more-icon">🛡️</span>
        Warranty
      </a>


      <a
        class="more-item"
        href="./schemes.html"
      >
        <span class="more-icon">🎁</span>
        Schemes
      </a>


      <a
        class="more-item"
        href="./payments.html"
      >
        <span class="more-icon">💳</span>
        Payments
      </a>


      <a
        class="more-item"
        href="./reports.html"
      >
        <span class="more-icon">📊</span>
        Reports
      </a>

    </div>

  </section>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a
      href="./dashboard.html"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>


    <a
      href="./service-requests.html"
      class="nav-item active"
    >
      <span class="nav-icon">▣</span>
      <span>Requests</span>
    </a>


    <a
      href="./jobs.html"
      class="nav-item"
    >
      <span class="nav-icon">🔧</span>
      <span>Jobs</span>
    </a>


    <a
      href="./products.html"
      class="nav-item"
    >
      <span class="nav-icon">📦</span>
      <span>Products</span>
    </a>


    <button
      id="moreNavBtn"
      class="nav-item"
      type="button"
    >
      <span class="nav-icon">☰</span>
      <span>More</span>
    </button>

  </nav>


  <!-- REQUEST MODAL -->

  <div
    id="modalBg"
    class="modal-bg"
  >

    <div class="modal">

      <div class="modal-head">

        <h2 id="modalTitle">
          New Service Request
        </h2>

        <button
          id="closeModal"
          class="close"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="requestForm">

        <input
          id="editRequestId"
          type="hidden"
        >


        <div class="form-grid">

          <div class="field">

            <label>
              Customer Name *
            </label>

            <input
              id="customerName"
              type="text"
              required
              placeholder="Customer name"
            >

          </div>


          <div class="field">

            <label>
              Mobile *
            </label>

            <input
              id="customerMobile"
              type="tel"
              inputmode="numeric"
              maxlength="10"
              required
              placeholder="10 digit mobile"
            >

          </div>


          <div class="field">

            <label>
              Address
            </label>

            <input
              id="customerAddress"
              type="text"
              placeholder="Customer address"
            >

          </div>


          <div class="field">

            <label>
              Device
            </label>

            <input
              id="device"
              type="text"
              placeholder="TV / DTH / other device"
            >

          </div>


          <div class="field">

            <label>
              Brand
            </label>

            <input
              id="deviceBrand"
              type="text"
              placeholder="Brand"
            >

          </div>


          <div class="field">

            <label>
              Model
            </label>

            <input
              id="deviceModel"
              type="text"
              placeholder="Model"
            >

          </div>


          <div class="field">

            <label>
              Service Type
            </label>

            <select id="serviceType">

              <option value="REPAIR">
                Repair
              </option>

              <option value="INSTALLATION">
                Installation
              </option>

              <option value="DEMO">
                Demo
              </option>

              <option value="DTH">
                DTH Service
              </option>

              <option value="OTHER">
                Other
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Problem / Requirement
            </label>

            <textarea
              id="problem"
              placeholder="Describe customer problem..."
            ></textarea>

          </div>

        </div>


        <div class="modal-actions">

          <button
            id="cancelModal"
            type="button"
            class="modal-btn cancel"
          >
            Cancel
          </button>


          <button
            id="saveBtn"
            type="submit"
            class="modal-btn save"
          >
            Create Request
          </button>

        </div>

      </form>

    </div>

  </div>


  <script
    type="module"
    src="../js/service-requests.js"
  ></script>

</body>
</html>
