<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commissions - REPARO V1</title>

  <link rel="stylesheet" href="../css/reparo.css">
</head>

<body>

<main class="page-container">

  <div class="page-header">
    <div>
      <h1>Commissions</h1>
      <p>Retailer commission rules & earnings</p>
    </div>

    <button id="addCommissionBtn" class="primary-btn">
      + Add Rule
    </button>
  </div>


  <section class="summary-grid">

    <div class="summary-card">
      <span>Total Rules</span>
      <strong id="totalRules">0</strong>
    </div>

    <div class="summary-card">
      <span>Active Rules</span>
      <strong id="activeRules">0</strong>
    </div>

    <div class="summary-card">
      <span>Percentage</span>
      <strong id="percentageRules">0</strong>
    </div>

    <div class="summary-card">
      <span>Fixed ₹</span>
      <strong id="fixedRules">0</strong>
    </div>

  </section>


  <section class="filter-bar">

    <input
      type="search"
      id="searchInput"
      placeholder="Search rule, product, category, retailer..."
    >

    <select id="ruleTypeFilter">

      <option value="">
        All Rule Types
      </option>

      <option value="DEFAULT">
        Default
      </option>

      <option value="CATEGORY">
        Category
      </option>

      <option value="PRODUCT">
        Product
      </option>

      <option value="RETAILER">
        Retailer
      </option>

    </select>

  </section>


  <div id="loading">
    Loading commission rules...
  </div>

  <section id="commissionList"></section>

</main>


<!-- COMMISSION MODAL -->

<div id="commissionModal" class="modal hidden">

  <div class="modal-content">

    <h2 id="modalTitle">
      Add Commission Rule
    </h2>


    <form id="commissionForm">

      <input
        type="hidden"
        id="editCommissionId"
      >


      <label>Rule Name *</label>

      <input
        type="text"
        id="ruleName"
        placeholder="e.g. Default Retailer Commission"
        required
      >


      <label>Rule Type *</label>

      <select id="ruleType" required>

        <option value="DEFAULT">
          Default
        </option>

        <option value="CATEGORY">
          Category
        </option>

        <option value="PRODUCT">
          Product
        </option>

        <option value="RETAILER">
          Retailer
        </option>

      </select>


      <label>Category</label>

      <select id="category">

        <option value="">
          -- Select Category --
        </option>

        <option value="TV Repair Part">
          TV Repair Part
        </option>

        <option value="TV Installation">
          TV Installation
        </option>

        <option value="DTH">
          DTH
        </option>

        <option value="HDMI">
          HDMI
        </option>

        <option value="Remote">
          Remote
        </option>

        <option value="Wall Mount">
          Wall Mount
        </option>

        <option value="Table Stand">
          Table Stand
        </option>

        <option value="FTTH">
          FTTH
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <label>Product ID</label>

      <input
        type="text"
        id="productId"
        placeholder="Required for Product rule"
      >


      <label>Retailer ID</label>

      <input
        type="text"
        id="retailerId"
        placeholder="Required for Retailer rule"
      >


      <label>Commission Type *</label>

      <select id="commissionType">

        <option value="PERCENTAGE">
          Percentage %
        </option>

        <option value="FIXED">
          Fixed ₹
        </option>

      </select>


      <label>Commission Value *</label>

      <input
        type="number"
        id="commissionValue"
        min="0"
        step="0.01"
        required
      >


      <label>Warranty Hold Days</label>

      <input
        type="number"
        id="warrantyHoldDays"
        min="0"
        step="1"
        value="0"
      >


      <label>Priority</label>

      <input
        type="number"
        id="priority"
        min="0"
        step="1"
        value="0"
      >


      <label>Active</label>

      <select id="active">

        <option value="true">
          Active
        </option>

        <option value="false">
          Inactive
        </option>

      </select>


      <div class="modal-actions">

        <button
          type="button"
          id="closeModalBtn">
          Cancel
        </button>

        <button
          type="submit"
          class="primary-btn">
          Save Rule
        </button>

      </div>

    </form>

  </div>

</div>


<script
  type="module"
  src="../js/commissions.js">
</script>

</body>
</html>
