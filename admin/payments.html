<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments | REPARO V1</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background:#f8fafc;
      color:#172033;
      font-family:Arial,sans-serif;
      margin:0;
      padding-bottom:82px;
    }

    .page {
      max-width:700px;
      margin:auto;
      padding:16px;
    }

    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .title {
      font-size:24px;
      font-weight:800;
    }

    .subtitle {
      color:#64748b;
      font-size:13px;
      margin-top:3px;
    }

    .logout {
      border:0;
      background:#172033;
      color:white;
      border-radius:12px;
      padding:9px 12px;
      font-size:12px;
      font-weight:700;
    }

    .summary-grid {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-bottom:16px;
    }

    .summary-card {
      background:white;
      border-radius:18px;
      padding:15px;
      box-shadow:0 4px 16px rgba(15,23,42,.06);
    }

    .summary-label {
      color:#64748b;
      font-size:11px;
      font-weight:700;
    }

    .summary-value {
      font-size:22px;
      font-weight:800;
      margin-top:5px;
    }

    .pending { color:#d97706; }
    .payable { color:#2563eb; }
    .paid { color:#059669; }
    .hold { color:#be185d; }

    .filter-box {
      background:white;
      border-radius:16px;
      padding:12px;
      margin-bottom:12px;
      box-shadow:0 4px 16px rgba(15,23,42,.05);
    }

    .filter-box input,
    .filter-box select {
      width:100%;
      box-sizing:border-box;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:12px;
      outline:none;
      background:#f8fafc;
      font-size:14px;
      margin-bottom:8px;
    }

    .filter-box input:focus,
    .filter-box select:focus {
      border-color:#ec4899;
      background:white;
    }

    .payment-card {
      background:white;
      border-radius:20px;
      padding:16px;
      margin-bottom:12px;
      box-shadow:0 5px 18px rgba(15,23,42,.07);
    }

    .card-top {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .payment-id {
      font-size:15px;
      font-weight:800;
    }

    .recipient {
      font-size:14px;
      font-weight:700;
      margin-top:4px;
    }

    .payment-type {
      color:#64748b;
      font-size:12px;
      margin-top:3px;
    }

    .status {
      border-radius:999px;
      padding:6px 9px;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    .status-pending {
      background:#fef3c7;
      color:#92400e;
    }

    .status-approved {
      background:#e0e7ff;
      color:#3730a3;
    }

    .status-payable {
      background:#dbeafe;
      color:#1e40af;
    }

    .status-paid {
      background:#d1fae5;
      color:#065f46;
    }

    .status-hold {
      background:#fce7f3;
      color:#9d174d;
    }

    .status-cancelled {
      background:#fee2e2;
      color:#991b1b;
    }

    .status-adjusted {
      background:#ede9fe;
      color:#5b21b6;
    }

    .amount-box {
      background:#f8fafc;
      border-radius:14px;
      padding:12px;
      margin-top:13px;
    }

    .amount-label {
      color:#64748b;
      font-size:10px;
    }

    .amount-value {
      font-size:21px;
      font-weight:800;
      margin-top:3px;
    }

    .info-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .info-box {
      background:#f8fafc;
      border-radius:12px;
      padding:10px;
    }

    .info-label {
      color:#64748b;
      font-size:10px;
    }

    .info-value {
      font-size:12px;
      font-weight:700;
      margin-top:3px;
    }

    .divider {
      height:1px;
      background:#e2e8f0;
      margin:14px 0;
    }

    .action-row {
      display:flex;
      gap:8px;
    }

    .action-btn {
      flex:1;
      border:0;
      border-radius:12px;
      padding:11px;
      font-size:12px;
      font-weight:800;
    }

    .view-btn {
      background:#eff6ff;
      color:#1d4ed8;
    }

    .approve-btn {
      background:#eef2ff;
      color:#4338ca;
    }

    .pay-btn {
      background:#ec4899;
      color:white;
    }

    .action-btn:disabled {
      opacity:.45;
    }

    .empty,
    .loading {
      background:white;
      border-radius:18px;
      padding:30px 18px;
      text-align:center;
      color:#64748b;
      box-shadow:0 4px 16px rgba(15,23,42,.05);
    }

    .empty-icon {
      font-size:30px;
      margin-bottom:8px;
    }

    .empty-title {
      color:#172033;
      font-weight:800;
    }

    .empty-text {
      font-size:13px;
      margin-top:4px;
    }

    .message {
      display:none;
      padding:12px;
      border-radius:12px;
      margin-bottom:12px;
      font-size:13px;
      font-weight:700;
    }

    .error {
      background:#fee2e2;
      color:#991b1b;
    }

    .success {
      background:#d1fae5;
      color:#065f46;
    }

    .modal-backdrop {
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:1000;
    }

    .modal-backdrop.show {
      display:flex;
    }

    .modal {
      width:100%;
      max-width:700px;
      max-height:92vh;
      overflow-y:auto;
      background:white;
      border-radius:24px 24px 0 0;
      padding:20px;
      box-sizing:border-box;
    }

    .modal-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    .modal-title {
      font-size:19px;
      font-weight:800;
    }

    .close-btn {
      border:0;
      background:#f1f5f9;
      border-radius:10px;
      width:36px;
      height:36px;
      font-size:20px;
    }

    .form-field {
      margin-bottom:13px;
    }

    .form-field label {
      display:block;
      font-size:11px;
      color:#64748b;
      font-weight:700;
      margin-bottom:5px;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width:100%;
      box-sizing:border-box;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:11px;
      background:#f8fafc;
      outline:none;
      font-size:13px;
    }

    .form-field textarea {
      min-height:75px;
      resize:vertical;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color:#ec4899;
      background:white;
    }

    .form-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .modal-actions {
      display:flex;
      gap:8px;
      margin-top:18px;
    }

    .modal-actions button {
      flex:1;
      border:0;
      border-radius:12px;
      padding:12px;
      font-weight:800;
    }

    .cancel-btn {
      background:#f1f5f9;
      color:#334155;
    }

    .primary-btn {
      background:#ec4899;
      color:white;
    }

    .bottom-nav {
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:white;
      border-top:1px solid #e2e8f0;
      height:68px;
      display:flex;
      justify-content:space-around;
      align-items:center;
      z-index:500;
    }

    .nav-item {
      border:0;
      background:transparent;
      color:#64748b;
      font-size:11px;
      font-weight:700;
      padding:8px;
    }

    .nav-item.active {
      color:#ec4899;
    }

    @media (min-width:640px) {
      .summary-grid {
        grid-template-columns:repeat(4,1fr);
      }

      .modal-backdrop {
        align-items:center;
      }

      .modal {
        border-radius:24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">
      <div>
        <div class="title">Payments</div>
        <div class="subtitle">Technician & retailer payment control</div>
      </div>

      <button id="logoutBtn" class="logout">
        Logout
      </button>
    </header>

    <div id="errorBox" class="message error"></div>
    <div id="successBox" class="message success"></div>

    <section class="summary-grid">

      <div class="summary-card">
        <div class="summary-label">Pending</div>
        <div id="pendingAmount" class="summary-value pending">₹0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Payable</div>
        <div id="payableAmount" class="summary-value payable">₹0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Warranty Hold</div>
        <div id="holdAmount" class="summary-value hold">₹0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Paid</div>
        <div id="paidAmount" class="summary-value paid">₹0</div>
      </div>

    </section>

    <section class="filter-box">

      <input
        id="searchInput"
        type="search"
        placeholder="Search Payment ID, Job, Person..."
      >

      <select id="paymentTypeFilter">
        <option value="">All Payment Types</option>
        <option value="TECHNICIAN">Technician</option>
        <option value="RETAILER">Retailer</option>
      </select>

      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="PENDING">Pending</option>
        <option value="APPROVED">Approved</option>
        <option value="PAYABLE">Payable</option>
        <option value="WARRANTY HOLD">Warranty Hold</option>
        <option value="PAID">Paid</option>
        <option value="ADJUSTED">Adjusted</option>
        <option value="CANCELLED">Cancelled</option>
      </select>

    </section>

    <section id="paymentContainer">
      <div class="loading">
        Loading payments...
      </div>
    </section>

  </main>


  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <div class="modal-header">

        <div id="modalTitle" class="modal-title">
          Payment Details
        </div>

        <button id="closeModalBtn" class="close-btn">
          ×
        </button>

      </div>

      <div id="modalContent"></div>

      <div id="paymentFormArea" style="display:none;">

        <div class="form-grid">

          <div class="form-field">
            <label>Payment Method</label>

            <select id="paymentMethod">
              <option value="UPI">UPI</option>
              <option value="BANK TRANSFER">Bank Transfer</option>
              <option value="CASH">Cash</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div class="form-field">
            <label>Transaction Reference</label>

            <input
              id="transactionReference"
              type="text"
              placeholder="UTR / Transaction ID"
            >
          </div>

        </div>

        <div class="form-field">

          <label>Payment Notes</label>

          <textarea
            id="paymentNotes"
            placeholder="Optional payment notes..."
          ></textarea>

        </div>

      </div>

      <div class="modal-actions">

        <button
          id="cancelModalBtn"
          type="button"
          class="cancel-btn"
        >
          Close
        </button>

        <button
          id="primaryModalBtn"
          type="button"
          class="primary-btn"
        >
          Action
        </button>

      </div>

    </div>

  </div>


  <nav class="bottom-nav">

    <button
      class="nav-item"
      onclick="window.location.href='./dashboard.html'"
    >
      🏠<br>Dashboard
    </button>

    <button
      class="nav-item"
      onclick="window.location.href='./commissions.html'"
    >
      ₹<br>Commission
    </button>

    <button
      class="nav-item active"
    >
      💳<br>Payments
    </button>

    <button
      class="nav-item"
      onclick="window.location.href='./warranty.html'"
    >
      🛡️<br>Warranty
    </button>

    <button
      class="nav-item"
      onclick="window.location.href='./reports.html'"
    >
      📊<br>Reports
    </button>

  </nav>


  <script
    type="module"
    src="../js/payments.js"
  ></script>

</body>
</html>
