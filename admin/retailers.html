<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>REPARO V1 - Retailers</title>

  <style>
    :root{
      --pink:#f9547c;
      --yellow:#ffe32b;
      --blue:#08aee0;
      --navy:#172033;
      --muted:#6b7280;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e5e7eb;
      --green:#16a34a;
      --red:#dc2626;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--navy);
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
      padding-bottom:88px;
    }

    .topbar{
      background:#fff;
      padding:22px 20px 18px;
      border-bottom:1px solid #eee;
      position:sticky;
      top:0;
      z-index:20;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:25px;
      font-weight:900;
    }

    .brand-logo{
      width:42px;
      height:42px;
      border-radius:13px;
      background:var(--yellow);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
      font-weight:900;
    }

    .logout{
      border:0;
      background:#f1f3f6;
      color:#111827;
      border-radius:24px;
      padding:11px 18px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }

    main{
      max-width:900px;
      margin:0 auto;
      padding:24px 20px;
    }

    .heading-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:20px;
    }

    h1{
      margin:0;
      font-size:34px;
      line-height:1.05;
      font-weight:900;
      letter-spacing:-1px;
    }

    .subtitle{
      margin:8px 0 0;
      color:var(--muted);
      font-size:16px;
      line-height:1.4;
    }

    .add-btn{
      border:0;
      background:var(--pink);
      color:#fff;
      border-radius:18px;
      padding:14px 18px;
      font-size:16px;
      font-weight:900;
      box-shadow:0 10px 22px rgba(249,84,124,.20);
      cursor:pointer;
      white-space:nowrap;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .stat{
      background:#fff;
      border-radius:22px;
      padding:18px 16px;
      box-shadow:0 4px 16px rgba(15,23,42,.05);
    }

    .stat-label{
      color:var(--muted);
      font-size:13px;
      text-transform:uppercase;
      margin-bottom:5px;
    }

    .stat-value{
      font-size:30px;
      font-weight:900;
    }

    .search-card{
      background:#fff;
      border-radius:24px;
      padding:16px;
      margin-bottom:18px;
      box-shadow:0 4px 16px rgba(15,23,42,.05);
    }

    input,
    select{
      width:100%;
      border:1px solid var(--border);
      background:#fafbfc;
      border-radius:16px;
      padding:15px 16px;
      font-size:16px;
      outline:none;
      color:var(--navy);
    }

    input:focus,
    select:focus{
      border-color:var(--pink);
      background:#fff;
    }

    .retailer-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .retailer-card{
      background:#fff;
      border-radius:24px;
      padding:20px;
      box-shadow:0 6px 20px rgba(15,23,42,.06);
    }

    .retailer-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .retailer-name{
      font-size:22px;
      font-weight:900;
      margin:0;
    }

    .shop{
      color:var(--muted);
      margin-top:4px;
      font-size:15px;
    }

    .badge{
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .badge.active{
      background:#dcfce7;
      color:#166534;
    }

    .badge.inactive{
      background:#fee2e2;
      color:#991b1b;
    }

    .details{
      margin-top:16px;
      display:grid;
      gap:8px;
      color:#4b5563;
      font-size:15px;
    }

    .detail{
      display:flex;
      gap:9px;
      align-items:flex-start;
    }

    .divider{
      height:1px;
      background:#eee;
      margin:16px 0;
    }

    .card-actions{
      display:flex;
      gap:10px;
    }

    .action{
      flex:1;
      border:0;
      border-radius:14px;
      padding:12px;
      font-weight:800;
      cursor:pointer;
      font-size:14px;
    }

    .edit{
      background:#dff5fc;
      color:#08779a;
    }

    .toggle{
      background:#fff2a8;
      color:#5d5100;
    }

    .empty{
      background:#fff;
      border-radius:24px;
      padding:45px 20px;
      text-align:center;
      color:var(--muted);
    }

    .loading{
      background:#fff;
      border-radius:24px;
      padding:35px;
      text-align:center;
      color:var(--muted);
    }

    .error{
      display:none;
      background:#fee2e2;
      color:#991b1b;
      padding:14px 16px;
      border-radius:16px;
      margin-bottom:16px;
      font-size:14px;
      font-weight:700;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:76px;
      background:#fff;
      border-top:1px solid #e8e8e8;
      display:flex;
      z-index:30;
    }

    .nav-item{
      flex:1;
      text-decoration:none;
      color:#6b7280;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-size:12px;
      font-weight:700;
    }

    .nav-item.active{
      color:var(--pink);
    }

    .nav-icon{
      font-size:22px;
      line-height:1;
    }


    /* =========================
       MODAL
    ========================= */

    .modal-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.52);
      z-index:100;
      padding:18px;
      overflow-y:auto;
    }

    .modal-backdrop.show{
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .modal{
      width:100%;
      max-width:620px;
      background:#fff;
      border-radius:28px 28px 20px 20px;
      padding:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.22);
      margin:auto;
    }

    .modal-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:18px;
    }

    .modal-title h2{
      margin:0;
      font-size:24px;
      font-weight:900;
    }

    .close{
      width:40px;
      height:40px;
      border:0;
      border-radius:50%;
      background:#f1f3f6;
      font-size:22px;
      cursor:pointer;
    }

    .form-grid{
      display:grid;
      gap:12px;
    }

    .field label{
      display:block;
      font-size:13px;
      font-weight:800;
      margin:0 0 6px 4px;
      color:#4b5563;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:18px;
    }

    .modal-btn{
      flex:1;
      border:0;
      border-radius:16px;
      padding:14px;
      font-size:15px;
      font-weight:900;
      cursor:pointer;
    }

    .cancel{
      background:#f1f3f6;
      color:#374151;
    }

    .save{
      background:var(--pink);
      color:#fff;
    }

    .save:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .small-note{
      margin-top:8px;
      color:#6b7280;
      font-size:12px;
      line-height:1.4;
    }


    @media(max-width:600px){

      main{
        padding:22px 16px;
      }

      .heading-row{
        align-items:center;
      }

      h1{
        font-size:32px;
      }

      .add-btn{
        padding:13px 14px;
      }

      .stats{
        gap:8px;
      }

      .stat{
        padding:15px 12px;
      }

      .stat-value{
        font-size:27px;
      }

    }
  </style>
</head>


<body>


  <!-- =================================================
       TOP BAR
  ================================================== -->

  <header class="topbar">

    <div class="brand-row">

      <div class="brand">

        <div class="brand-logo">
          R
        </div>

        <span>
          REPARO
        </span>

      </div>


      <button
        id="logoutBtn"
        class="logout"
      >
        Logout
      </button>

    </div>

  </header>



  <!-- =================================================
       MAIN
  ================================================== -->

  <main>


    <div class="heading-row">

      <div>

        <h1>
          Retailers
        </h1>

        <p class="subtitle">
          Manage REPARO service partners
        </p>

      </div>


      <button
        id="addRetailerBtn"
        class="add-btn"
      >
        + Add Retailer
      </button>

    </div>



    <div
      id="errorBox"
      class="error"
    ></div>



    <!-- =================================================
         STATS
    ================================================== -->

    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          Total
        </div>

        <div
          id="totalCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Active
        </div>

        <div
          id="activeCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Inactive
        </div>

        <div
          id="inactiveCount"
          class="stat-value"
        >
          0
        </div>

      </div>

    </section>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <section class="search-card">

      <input
        id="searchInput"
        type="search"
        placeholder="Search retailer, shop or mobile..."
      >

    </section>



    <!-- =================================================
         RETAILER LIST
    ================================================== -->

    <section id="retailerContainer">

      <div class="loading">
        Loading retailers...
      </div>

    </section>


  </main>



  <!-- =================================================
       BOTTOM NAV
  ================================================== -->

  <nav class="bottom-nav">

    <a
      class="nav-item"
      href="./dashboard.html"
    >
      <span class="nav-icon">
        ⌂
      </span>

      <span>
        Home
      </span>
    </a>


    <a
      class="nav-item active"
      href="./retailers.html"
    >
      <span class="nav-icon">
        ▣
      </span>

      <span>
        Retailers
      </span>
    </a>


    <a
      class="nav-item"
      href="./technicians.html"
    >
      <span class="nav-icon">
        ⚙
      </span>

      <span>
        Technicians
      </span>
    </a>


    <a
      class="nav-item"
      href="./customers.html"
    >
      <span class="nav-icon">
        ●
      </span>

      <span>
        Customers
      </span>
    </a>

  </nav>



  <!-- =================================================
       ADD / EDIT RETAILER MODAL
  ================================================== -->

  <div
    id="modalBackdrop"
    class="modal-backdrop"
  >

    <div class="modal">


      <div class="modal-title">

        <h2 id="modalTitle">
          Add Retailer
        </h2>

        <button
          id="closeModalBtn"
          class="close"
          type="button"
        >
          ×
        </button>

      </div>



      <form id="retailerForm">

        <input
          type="hidden"
          id="editUid"
        >


        <div class="form-grid">


          <!-- NAME -->

          <div class="field">

            <label>
              Retailer Name *
            </label>

            <input
              id="name"
              required
              autocomplete="name"
              placeholder="Enter retailer name"
            >

          </div>



          <!-- SHOP -->

          <div class="field">

            <label>
              Shop Name *
            </label>

            <input
              id="shopName"
              required
              placeholder="Enter shop name"
            >

          </div>



          <!-- MOBILE -->

          <div class="field">

            <label>
              Mobile *
            </label>

            <input
              id="mobile"
              required
              inputmode="numeric"
              maxlength="10"
              placeholder="10 digit mobile number"
            >

          </div>



          <!-- EMAIL -->

          <div class="field">

            <label>
              Email *
            </label>

            <input
              id="email"
              required
              type="email"
              autocomplete="email"
              placeholder="retailer@example.com"
            >

          </div>



          <!-- PASSWORD -->

          <div class="field">

            <label>
              Password *
            </label>

            <input
              id="password"
              type="password"
              minlength="6"
              autocomplete="new-password"
              placeholder="Minimum 6 characters"
            >

            <div class="small-note">

              New retailer માટે login password જરૂરી છે.
              Edit કરતી વખતે password blank રાખો.

            </div>

          </div>



          <!-- ADDRESS -->

          <div class="field">

            <label>
              Address
            </label>

            <input
              id="address"
              placeholder="Shop / area / city"
            >

          </div>


        </div>



        <div class="modal-actions">


          <button
            type="button"
            id="cancelBtn"
            class="modal-btn cancel"
          >
            Cancel
          </button>


          <button
            type="submit"
            id="saveBtn"
            class="modal-btn save"
          >
            Create Retailer
          </button>


        </div>


      </form>

    </div>

  </div>



  <!-- =================================================
       JAVASCRIPT
  ================================================== -->

  <script
    type="module"
    src="../js/retailers.js"
  ></script>


</body>
</html>
