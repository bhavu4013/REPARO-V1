<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPARO V1 - Retailers</title>

  <style>
    :root {
      --pink: #f9547c;
      --yellow: #ffe32b;
      --blue: #08aee0;
      --navy: #172033;
      --muted: #6b7280;
      --bg: #f6f7fb;
      --border: #e5e7eb;
      --green: #16a34a;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding-bottom: 88px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      background: #fff;
      padding: 18px 18px 16px;
      border-bottom: 1px solid #eeeeee;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 900;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 900;
    }

    .logout {
      border: 0;
      background: #f1f3f6;
      color: #111827;
      border-radius: 24px;
      padding: 10px 17px;
      font-size: 14px;
      font-weight: 800;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 16px;
    }

    .heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .add-btn {
      border: 0;
      background: var(--pink);
      color: #fff;
      border-radius: 17px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 9px 20px rgba(249, 84, 124, 0.20);
    }

    .add-btn:active {
      transform: scale(.98);
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 16px;
      padding: 13px 15px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }

    .success {
      display: none;
      background: #dcfce7;
      color: #166534;
      border-radius: 16px;
      padding: 13px 15px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: #fff;
      border-radius: 21px;
      padding: 16px 13px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .05);
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 900;
    }

    .search-card {
      background: #fff;
      border-radius: 21px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .05);
    }

    #searchInput {
      width: 100%;
      border: 1px solid var(--border);
      background: #fafbfc;
      border-radius: 15px;
      padding: 14px 15px;
      font-size: 16px;
      outline: none;
      color: var(--navy);
    }

    #searchInput:focus {
      border-color: var(--pink);
      background: #fff;
    }

    .retailer-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .retailer-card {
      background: #fff;
      border-radius: 23px;
      padding: 18px;
      box-shadow: 0 5px 19px rgba(15, 23, 42, .055);
    }

    .retailer-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .retailer-name {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .shop {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .badge {
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.active {
      background: #dcfce7;
      color: #166534;
    }

    .badge.inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .details {
      display: grid;
      gap: 8px;
      margin-top: 15px;
      color: #4b5563;
      font-size: 14px;
    }

    .detail {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .detail-icon {
      width: 21px;
      flex: 0 0 21px;
    }

    .divider {
      height: 1px;
      background: #eeeeee;
      margin: 15px 0;
    }

    .card-actions {
      display: flex;
      gap: 9px;
    }

    .action {
      flex: 1;
      border: 0;
      border-radius: 13px;
      padding: 11px;
      font-size: 14px;
      font-weight: 800;
    }

    .edit {
      background: #dff5fc;
      color: #08779a;
    }

    .toggle {
      background: #fff2a8;
      color: #5d5100;
    }

    .loading,
    .empty {
      background: #fff;
      border-radius: 22px;
      padding: 38px 20px;
      text-align: center;
      color: var(--muted);
      box-shadow: 0 4px 16px rgba(15, 23, 42, .04);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      text-decoration: none;
      color: #6b7280;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .nav-item.active {
      color: var(--pink);
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-backdrop.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: 100%;
      max-width: 580px;
      background: #fff;
      border-radius: 27px;
      padding: 20px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .25);
    }

    .modal-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-title h2 {
      margin: 0;
      font-size: 23px;
      font-weight: 900;
    }

    .close {
      width: 39px;
      height: 39px;
      border: 0;
      border-radius: 50%;
      background: #f1f3f6;
      font-size: 23px;
      line-height: 1;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin: 0 0 6px 3px;
      color: #4b5563;
      font-size: 13px;
      font-weight: 800;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      background: #fafbfc;
      border-radius: 15px;
      padding: 14px 15px;
      font-size: 16px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--pink);
      background: #fff;
    }

    .field input:disabled {
      background: #f1f3f6;
      color: #6b7280;
    }

    .small-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-btn {
      flex: 1;
      border: 0;
      border-radius: 15px;
      padding: 14px;
      font-size: 15px;
      font-weight: 900;
    }

    .cancel {
      background: #f1f3f6;
      color: #374151;
    }

    .save {
      background: var(--pink);
      color: #fff;
    }

    .save:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    @media (min-width: 700px) {
      .topbar {
        padding-left: 24px;
        padding-right: 24px;
      }

      main {
        padding: 28px 24px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand-row">

    <div class="brand">
      <div class="brand-logo">R</div>
      <span>REPARO</span>
    </div>

    <button id="logoutBtn" class="logout" type="button">
      Logout
    </button>

  </div>
</header>


<main>

  <div class="heading-row">

    <div>
      <h1>Retailers</h1>

      <p class="subtitle">
        Manage REPARO service partners
      </p>
    </div>

    <button
      id="addRetailerBtn"
      class="add-btn"
      type="button">
      + Add Retailer
    </button>

  </div>


  <div id="errorBox" class="error"></div>

  <div id="successBox" class="success"></div>


  <section class="stats">

    <div class="stat">
      <div class="stat-label">Total</div>
      <div id="totalCount" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Active</div>
      <div id="activeCount" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Inactive</div>
      <div id="inactiveCount" class="stat-value">0</div>
    </div>

  </section>


  <section class="search-card">

    <input
      id="searchInput"
      type="search"
      placeholder="Search retailer, shop or mobile..."
    >

  </section>


  <section id="retailerContainer">

    <div class="loading">
      Loading retailers...
    </div>

  </section>

</main>


<nav class="bottom-nav">

  <a class="nav-item" href="./dashboard.html">
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </a>

  <a class="nav-item active" href="./retailers.html">
    <span class="nav-icon">▣</span>
    <span>Retailers</span>
  </a>

  <a class="nav-item" href="./technicians.html">
    <span class="nav-icon">⚙</span>
    <span>Technicians</span>
  </a>

  <a class="nav-item" href="./customers.html">
    <span class="nav-icon">●</span>
    <span>Customers</span>
  </a>

</nav>


<!-- ADD / EDIT MODAL -->

<div id="modalBackdrop" class="modal-backdrop">

  <div class="modal">

    <div class="modal-title">

      <h2 id="modalTitle">
        Add Retailer
      </h2>

      <button
        id="closeModalBtn"
        class="close"
        type="button">
        ×
      </button>

    </div>


    <form id="retailerForm">

      <input type="hidden" id="editUid">


      <div class="form-grid">


        <div class="field">

          <label for="name">
            Retailer Name *
          </label>

          <input
            id="name"
            type="text"
            required
            autocomplete="name"
            placeholder="Enter retailer name"
          >

        </div>


        <div class="field">

          <label for="shopName">
            Shop Name *
          </label>

          <input
            id="shopName"
            type="text"
            required
            placeholder="Enter shop name"
          >

        </div>


        <div class="field">

          <label for="mobile">
            Mobile Number *
          </label>

          <input
            id="mobile"
            type="tel"
            required
            inputmode="numeric"
            maxlength="10"
            minlength="10"
            pattern="[0-9]{10}"
            placeholder="10 digit mobile number"
          >

          <div class="small-note">
            આ mobile numberથી retailer login કરશે.
          </div>

        </div>


        <div class="field">

          <label for="pin">
            6 Digit PIN *
          </label>

          <input
            id="pin"
            type="password"
            required
            inputmode="numeric"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            autocomplete="new-password"
            placeholder="Enter 6 digit PIN"
          >

          <div class="small-note">
            Retailer આ PINથી login કરશે. PIN exactly 6 digits હોવો જોઈએ.
          </div>

        </div>


        <div class="field">

          <label for="address">
            Address
          </label>

          <input
            id="address"
            type="text"
            placeholder="Shop / area / city"
          >

        </div>


      </div>


      <div class="modal-actions">

        <button
          id="cancelBtn"
          type="button"
          class="modal-btn cancel">
          Cancel
        </button>

        <button
          id="saveBtn"
          type="submit"
          class="modal-btn save">
          Create Retailer
        </button>

      </div>

    </form>

  </div>

</div>


<script
  type="module"
  src="../js/retailers.js">
</script>

</body>
</html>
