<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REPARO — Retailers</title>

<link rel="stylesheet" href="../css/reparo.css">

<style>
.page-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:#fff;
  box-shadow:var(--reparo-shadow);
  cursor:pointer;
  font-size:20px;
}

.page-title{
  font-size:23px;
  font-weight:900;
}

.search-box{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--reparo-border);
  border-radius:15px;
  background:#fff;
  outline:none;
  margin-bottom:15px;
}

.search-box:focus{
  border-color:var(--reparo-blue);
}

.retailer-card{
  background:#fff;
  border-radius:20px;
  padding:17px;
  margin-bottom:12px;
  box-shadow:var(--reparo-shadow);
}

.retailer-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.retailer-name{
  font-size:17px;
  font-weight:900;
}

.shop-name{
  color:var(--reparo-muted);
  font-size:13px;
  margin-top:4px;
}

.status{
  padding:6px 9px;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.status-active{
  background:#E0F7FC;
  color:#087C99;
}

.status-inactive{
  background:#FEE2E2;
  color:#B91C1C;
}

.retailer-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:14px;
}

.info-box{
  background:#F8FAFC;
  border-radius:12px;
  padding:10px;
}

.info-box small{
  display:block;
  color:var(--reparo-muted);
  font-size:11px;
}

.info-box strong{
  display:block;
  margin-top:3px;
  font-size:14px;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.card-actions button{
  flex:1;
}

.fab{
  position:fixed;
  right:18px;
  bottom:82px;
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:var(--reparo-pink);
  color:#fff;
  font-size:28px;
  box-shadow:0 8px 20px rgba(249,84,124,.35);
  cursor:pointer;
  z-index:25;
}

.empty{
  background:#fff;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  color:var(--reparo-muted);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:22px 18px 30px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
}

.close-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#F3F4F6;
  cursor:pointer;
  font-size:20px;
}

.form-label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:10px 0 7px;
}

.form-error{
  background:#FEF2F2;
  color:#DC2626;
  padding:11px;
  border-radius:12px;
  margin-bottom:12px;
  font-size:13px;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  background:var(--reparo-pink);
  color:#fff;
  font-weight:900;
  margin-top:12px;
  cursor:pointer;
}

@media(min-width:700px){
  .modal{
    align-items:center;
    padding:20px;
  }

  .modal-box{
    border-radius:28px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      R
    </div>

    <div>REPARO</div>

  </div>

  <button
    id="logoutBtn"
    class="btn"
    style="padding:9px 13px;background:#F3F4F6;"
  >
    Logout
  </button>

</header>


<main class="container">

  <div class="page-head">

    <button
      id="backBtn"
      class="back-btn"
    >
      ←
    </button>

    <div class="page-title">
      Retailers
    </div>

  </div>


  <input
    id="searchInput"
    class="search-box"
    type="search"
    placeholder="Search retailer, shop or mobile..."
  >


  <div id="retailerList">

    <div class="empty">
      Loading retailers...
    </div>

  </div>

</main>


<nav class="bottom-nav">

  <button id="homeNav" class="active">
    ⌂<br>
    Home
  </button>

  <button id="leadNav">
    ＋<br>
    Leads
  </button>

  <button id="jobNav">
    🔧<br>
    Jobs
  </button>

  <button id="earningNav">
    ₹<br>
    Earnings
  </button>

  <button>
    ☰<br>
    More
  </button>

</nav>


<button
  id="addRetailerBtn"
  class="fab"
>
  +
</button>


<!-- ADD RETAILER -->

<div
  id="retailerModal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>Add Retailer</h2>

      <button
        id="closeModal"
        class="close-btn"
      >
        ×
      </button>

    </div>


    <div
      id="formError"
      class="form-error hidden"
    ></div>


    <label class="form-label">
      Retailer Name *
    </label>

    <input
      id="retailerName"
      class="input"
      placeholder="Owner / contact name"
    >


    <label class="form-label">
      Shop Name *
    </label>

    <input
      id="shopName"
      class="input"
      placeholder="Shop name"
    >


    <label class="form-label">
      Mobile *
    </label>

    <input
      id="mobile"
      class="input"
      type="tel"
      placeholder="Mobile number"
    >


    <label class="form-label">
      Email *
    </label>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Retailer login email"
    >


    <label class="form-label">
      Temporary Password *
    </label>

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Minimum 6 characters"
    >


    <label class="form-label">
      Commission Type
    </label>

    <select
      id="commissionType"
      class="input"
    >
      <option value="percentage">
        Percentage
      </option>

      <option value="fixed">
        Fixed ₹
      </option>
    </select>


    <label class="form-label">
      Commission Value
    </label>

    <input
      id="commissionValue"
      class="input"
      type="number"
      min="0"
      value="10"
    >


    <button
      id="saveRetailer"
      class="save-btn"
    >
      Create Retailer
    </button>

  </div>

</div>


<script type="module">

import {
  auth,
  db
} from "../js/firebase.js";


import {
  getUserProfile,
  logout
} from "../js/auth.js";


import {
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  getAuth
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  collection,
  getDocs,
  doc,
  setDoc,
  updateDoc,
  query,
  limit
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBZehAJk3lMWsOAwrG4-qT24_abBIfGJHs",

  authDomain:
    "reparo-v1.firebaseapp.com",

  projectId:
    "reparo-v1",

  storageBucket:
    "reparo-v1.firebasestorage.app",

  messagingSenderId:
    "830095721173",

  appId:
    "1:830095721173:web:c5e670fbc94e7cc42b185c"

};


/*
 Secondary Firebase app.

 Admin login will remain active
 when a retailer account is created.
*/

const secondaryApp =
  initializeApp(
    firebaseConfig,
    "RETAILER_CREATE_APP"
  );


const secondaryAuth =
  getAuth(
    secondaryApp
  );


/* ==========================================
   VARIABLES
========================================== */

let retailers = [];

const retailerList =
  document.getElementById(
    "retailerList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const modal =
  document.getElementById(
    "retailerModal"
  );

const formError =
  document.getElementById(
    "formError"
  );


/* ==========================================
   ADMIN AUTH CHECK
========================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "../index.html";

      return;
    }


    try{

      const profile =
        await getUserProfile(
          user.uid
        );


      if(
        profile.role !== "admin" ||
        profile.active !== true
      ){

        window.location.href =
          "../index.html";

        return;
      }


      await loadRetailers();

    }
    catch(error){

      console.error(error);

      window.location.href =
        "../index.html";

    }

  }
);


/* ==========================================
   LOAD RETAILERS
========================================== */

async function loadRetailers(){

  retailerList.innerHTML = `
    <div class="empty">
      Loading retailers...
    </div>
  `;


  try{

    const snapshot =
      await getDocs(
        query(
          collection(
            db,
            "retailers"
          ),
          limit(500)
        )
      );


    retailers =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    renderRetailers(
      retailers
    );

  }
  catch(error){

    console.error(error);

    retailerList.innerHTML = `
      <div class="empty">
        Retailers load કરવામાં
        સમસ્યા આવી.<br><br>
        ${escapeHtml(error.code)}
      </div>
    `;

  }

}


/* ==========================================
   RENDER
========================================== */

function renderRetailers(list){

  if(!list.length){

    retailerList.innerHTML = `
      <div class="empty">

        કોઈ retailer મળ્યો નથી.

        <br><br>

        + button દબાવીને
        retailer બનાવો.

      </div>
    `;

    return;
  }


  retailerList.innerHTML = "";


  list.forEach(
    retailer => {

      const active =
        retailer.active !== false;


      const commission =
        retailer.commissionType === "fixed"

          ? "₹" +
            Number(
              retailer.commissionValue || 0
            ).toLocaleString("en-IN")

          : Number(
              retailer.commissionValue || 0
            ) + "%";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "retailer-card";


      card.innerHTML = `

        <div class="retailer-top">

          <div>

            <div class="retailer-name">

              ${escapeHtml(
                retailer.name ||
                "Unnamed Retailer"
              )}

            </div>


            <div class="shop-name">

              ${escapeHtml(
                retailer.shopName ||
                "Shop name not available"
              )}

            </div>

          </div>


          <div
            class="status ${
              active
                ? "status-active"
                : "status-inactive"
            }"
          >

            ${
              active
                ? "ACTIVE"
                : "INACTIVE"
            }

          </div>

        </div>


        <div class="retailer-grid">

          <div class="info-box">

            <small>Mobile</small>

            <strong>
              ${escapeHtml(
                retailer.mobile || "-"
              )}
            </strong>

          </div>


          <div class="info-box">

            <small>Commission</small>

            <strong>
              ${commission}
            </strong>

          </div>


          <div class="info-box">

            <small>Total Leads</small>

            <strong>
              ${Number(
                retailer.totalLeads || 0
              )}
            </strong>

          </div>


          <div class="info-box">

            <small>Completed Jobs</small>

            <strong>
              ${Number(
                retailer.completedJobs || 0
              )}
            </strong>

          </div>

        </div>


        <div class="card-actions">

          <button
            class="btn ${
              active
                ? ""
                : "btn-primary"
            } toggle-btn"
            style="
              background:${
                active
                  ? "#F3F4F6"
                  : "var(--reparo-blue)"
              };
              color:${
                active
                  ? "var(--reparo-text)"
                  : "#fff"
              };
            "
          >

            ${
              active
                ? "Deactivate"
                : "Activate"
            }

          </button>

        </div>

      `;


      card
        .querySelector(
          ".toggle-btn"
        )
        .addEventListener(
          "click",
          () =>
            toggleRetailer(
              retailer
            )
        );


      retailerList.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
  "input",
  () => {

    const term =
      searchInput.value
        .trim()
        .toLowerCase();


    if(!term){

      renderRetailers(
        retailers
      );

      return;
    }


    const filtered =
      retailers.filter(
        retailer => {

          return (

            String(
              retailer.name || ""
            )
            .toLowerCase()
            .includes(term)

            ||

            String(
              retailer.shopName || ""
            )
            .toLowerCase()
            .includes(term)

            ||

            String(
              retailer.mobile || ""
            )
            .includes(term)

            ||

            String(
              retailer.email || ""
            )
            .toLowerCase()
            .includes(term)

          );

        }
      );


    renderRetailers(
      filtered
    );

  }
);


/* ==========================================
   ACTIVATE / DEACTIVATE
========================================== */

async function toggleRetailer(
  retailer
){

  const newStatus =
    retailer.active === false;


  try{

    await updateDoc(
      doc(
        db,
        "retailers",
        retailer.id
      ),
      {
        active:newStatus,
        updatedAt:new Date()
      }
    );


    await updateDoc(
      doc(
        db,
        "users",
        retailer.id
      ),
      {
        active:newStatus,
        updatedAt:new Date()
      }
    );


    await loadRetailers();

  }
  catch(error){

    console.error(error);

    alert(
      "Status update failed: " +
      error.code
    );

  }

}


/* ==========================================
   OPEN MODAL
========================================== */

document
  .getElementById(
    "addRetailerBtn"
  )
  .addEventListener(
    "click",
    () => {

      formError.classList.add(
        "hidden"
      );

      modal.classList.remove(
        "hidden"
      );

    }
  );


/* ==========================================
   CLOSE MODAL
========================================== */

document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeRetailerModal
  );


function closeRetailerModal(){

  modal.classList.add(
    "hidden"
  );

}


/* ==========================================
   CREATE RETAILER
========================================== */

document
  .getElementById(
    "saveRetailer"
  )
  .addEventListener(
    "click",
    createRetailer
  );


async function createRetailer(){

  const name =
    document
      .getElementById(
        "retailerName"
      )
      .value
      .trim();


  const shopName =
    document
      .getElementById(
        "shopName"
      )
      .value
      .trim();


  const mobile =
    document
      .getElementById(
        "mobile"
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const commissionType =
    document
      .getElementById(
        "commissionType"
      )
      .value;


  const commissionValue =
    Number(
      document
        .getElementById(
          "commissionValue"
        )
        .value
    );


  formError.classList.add(
    "hidden"
  );


  if(
    !name ||
    !shopName ||
    !mobile ||
    !email ||
    !password
  ){

    showFormError(
      "બધી જરૂરી માહિતી ભરો."
    );

    return;
  }


  if(
    password.length < 6
  ){

    showFormError(
      "Password ઓછામાં ઓછો 6 characters હોવો જોઈએ."
    );

    return;
  }


  if(
    commissionValue < 0
  ){

    showFormError(
      "Commission value યોગ્ય નાખો."
    );

    return;
  }


  const saveButton =
    document.getElementById(
      "saveRetailer"
    );


  saveButton.disabled =
    true;

  saveButton.textContent =
    "Creating...";


  try{

    /*
      1. Firebase Authentication
    */

    const credential =
      await createUserWithEmailAndPassword(
        secondaryAuth,
        email,
        password
      );


    const uid =
      credential.user.uid;


    /*
      2. users/{uid}
    */

    await setDoc(
      doc(
        db,
        "users",
        uid
      ),
      {

        name:name,

        email:email,

        mobile:mobile,

        role:"retailer",

        active:true,

        createdAt:new Date()

      }
    );


    /*
      3. retailers/{uid}
    */

    await setDoc(
      doc(
        db,
        "retailers",
        uid
      ),
      {

        userId:uid,

        name:name,

        shopName:shopName,

        mobile:mobile,

        email:email,

        commissionType:
          commissionType,

        commissionValue:
          commissionValue,

        active:true,

        totalLeads:0,

        completedJobs:0,

        totalServiceValue:0,

        totalCommission:0,

        protectedCustomers:0,

        createdAt:new Date(),

        updatedAt:new Date()

      }
    );


    /*
      Sign out only the
      secondary retailer session.
    */

    await secondaryAuth.signOut();


    clearForm();

    closeRetailerModal();

    await loadRetailers();


    alert(
      "Retailer successfully created."
    );


  }
  catch(error){

    console.error(error);


    let message =
      "Retailer creation failed: " +
      error.code;


    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      message =
        "આ Email પહેલેથી Firebase Authenticationમાં છે.";

    }


    if(
      error.code ===
      "auth/invalid-email"
    ){

      message =
        "Email format ખોટું છે.";

    }


    if(
      error.code ===
      "auth/weak-password"
    ){

      message =
        "Password વધુ strong રાખો.";

    }


    if(
      error.code ===
      "permission-denied"
    ){

      message =
        "Firestore permission denied. Rules તપાસો.";

    }


    showFormError(
      message
    );

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Create Retailer";

  }

}


/* ==========================================
   FORM HELPERS
========================================== */

function showFormError(
  message
){

  formError.textContent =
    message;

  formError.classList.remove(
    "hidden"
  );

}


function clearForm(){

  document.getElementById(
    "retailerName"
  ).value = "";


  document.getElementById(
    "shopName"
  ).value = "";


  document.getElementById(
    "mobile"
  ).value = "";


  document.getElementById(
    "email"
  ).value = "";


  document.getElementById(
    "password"
  ).value = "";
