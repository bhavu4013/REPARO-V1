<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs | REPARO V1</title>

  <link rel="stylesheet" href="../css/reparo.css">
</head>

<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="page-header">
      <div>
        <div class="eyebrow">REPARO V1</div>
        <h1>Jobs</h1>
        <p>Service execution & technician assignment</p>
      </div>

      <div class="header-badge">
        ADMIN
      </div>
    </header>


    <!-- SUMMARY -->
    <section class="stats-grid">

      <div class="stat-card">
        <div class="stat-label">TOTAL JOBS</div>
        <div id="totalJobs" class="stat-value">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">NEW</div>
        <div id="newJobs" class="stat-value">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">ACTIVE</div>
        <div id="activeJobs" class="stat-value">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">COMPLETED</div>
        <div id="completedJobs" class="stat-value">0</div>
      </div>

    </section>


    <!-- SEARCH -->
    <section class="card">

      <div class="section-title">
        <div>
          <h2>Job Management</h2>
          <p>Search and manage service jobs</p>
        </div>
      </div>

      <div class="input-group">

        <input
          type="search"
          id="searchInput"
          class="form-input"
          placeholder="Search Job ID, customer, mobile..."
        >

        <select
          id="statusFilter"
          class="form-input">

          <option value="">All Status</option>
          <option value="NEW">New</option>
          <option value="ASSIGNED">Assigned</option>
          <option value="IN PROGRESS">In Progress</option>
          <option value="DIAGNOSIS">Diagnosis</option>
          <option value="CUSTOMER APPROVAL">
            Customer Approval
          </option>
          <option value="REPAIR">Repair</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>

        </select>

      </div>

    </section>


    <!-- JOB LIST -->
    <section>

      <div id="loading" class="loading-state">
        Loading Jobs...
      </div>

      <div id="jobList"></div>

    </section>

  </div>


  <!-- EDIT JOB MODAL -->

  <div
    id="jobModal"
    class="modal-overlay hidden">

    <div class="modal-card">

      <div class="modal-header">

        <div>
          <div class="eyebrow">
            JOB MANAGEMENT
          </div>

          <h2>Edit Job</h2>
        </div>

        <button
          type="button"
          id="closeModalBtn"
          class="icon-btn">
          ×
        </button>

      </div>


      <form id="jobForm">

        <input
          type="hidden"
          id="editJobId"
        >


        <div class="form-field">

          <label>
            Job Status
          </label>

          <select
            id="jobStatus"
            class="form-input">

            <option value="NEW">NEW</option>
            <option value="ASSIGNED">ASSIGNED</option>
            <option value="IN PROGRESS">
              IN PROGRESS
            </option>
            <option value="DIAGNOSIS">
              DIAGNOSIS
            </option>
            <option value="CUSTOMER APPROVAL">
              CUSTOMER APPROVAL
            </option>
            <option value="REPAIR">
              REPAIR
            </option>
            <option value="COMPLETED">
              COMPLETED
            </option>
            <option value="CANCELLED">
              CANCELLED
            </option>

          </select>

        </div>


        <div class="form-field">

          <label>
            Assign Technician
          </label>

          <select
            id="technicianSelect"
            class="form-input">

            <option value="">
              Select Technician
            </option>

          </select>

        </div>


        <div class="form-field">

          <label>
            Admin Notes
          </label>

          <textarea
            id="adminNotes"
            class="form-input"
            rows="4"
            placeholder="Internal job notes...">
          </textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            id="cancelModalBtn"
            class="secondary-btn">
            Cancel
          </button>

          <button
            type="submit"
            class="primary-btn">
            Save Job
          </button>

        </div>

      </form>

    </div>

  </div>


  <script
    type="module"
    src="../js/jobs.js">
  </script>

</body>
</html>
