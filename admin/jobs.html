<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>REPARO V1 - Jobs</title>

  <style>
    :root {
      --pink: #f9547c;
      --yellow: #ffe32b;
      --blue: #08aee0;
      --navy: #172033;
      --muted: #6b7280;
      --bg: #f6f7fb;
      --border: #e5e7eb;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #f59e0b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding-bottom: 86px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    .topbar {
      background: #fff;
      border-bottom: 1px solid #eeeeee;
      padding: 16px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 900;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
    }

    .logout {
      border: 0;
      background: #f1f3f6;
      color: var(--navy);
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 800;
    }

    /* MAIN */

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 16px;
    }

    .heading-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: #fff;
      border-radius: 20px;
      padding: 15px 12px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
    }

    .summary-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 26px;
      font-weight: 900;
    }

    .summary-card.new .summary-value {
      color: var(--pink);
    }

    .summary-card.active .summary-value {
      color: var(--blue);
    }

    .summary-card.completed .summary-value {
      color: var(--green);
    }

    /* MANAGEMENT */

    .management {
      background: #fff;
      border-radius: 25px;
      padding: 19px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, .055);
    }

    .management-title {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
    }

    .management-subtitle {
      margin: 6px 0 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 9px;
    }

    .filters input,
    .filters select {
      width: 100%;
      border: 1px solid var(--border);
      background: #fafbfc;
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      color: var(--navy);
      font-size: 14px;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: var(--pink);
      background: #fff;
    }

    /* MESSAGE */

    .message {
      display: none;
      border-radius: 15px;
      padding: 13px 15px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    /* JOB LIST */

    .job-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .job-card {
      background: #fff;
      border-radius: 22px;
      padding: 17px;
      box-shadow: 0 5px 19px rgba(15, 23, 42, .055);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .job-id {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .customer-name {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-new {
      background: #ffe4ec;
      color: #c72554;
    }

    .status-assigned {
      background: #dff7fd;
      color: #08779a;
    }

    .status-progress {
      background: #fff3c4;
      color: #796000;
    }

    .status-diagnosis {
      background: #e9ddff;
      color: #6335a5;
    }

    .status-approval {
      background: #ffedd5;
      color: #9a4d00;
    }

    .status-repair {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .job-info {
      display: grid;
      gap: 8px;
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      color: #4b5563;
    }

    .info-icon {
      width: 20px;
      flex: 0 0 20px;
      text-align: center;
    }

    .job-divider {
      height: 1px;
      background: #eeeeee;
      margin: 15px 0;
    }

    .job-actions {
      display: flex;
      gap: 9px;
    }

    .job-action {
      flex: 1;
      border: 0;
      border-radius: 13px;
      padding: 11px;
      font-size: 13px;
      font-weight: 800;
    }

    .view-btn {
      background: #dff5fc;
      color: #08779a;
    }

    .assign-btn {
      background: #fff2a8;
      color: #5d5100;
    }

    .empty {
      background: #fff;
      border-radius: 23px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .04);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .empty-text {
      color: var(--muted);
      font-size: 14px;
    }

    .loading {
      background: #fff;
      border-radius: 22px;
      padding: 38px;
      text-align: center;
      color: var(--muted);
    }

    /* MODAL */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-backdrop.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #f1f3f6;
      font-size: 23px;
    }

    .modal-content {
      display: grid;
      gap: 12px;
    }

    .form-field label {
      display: block;
      margin: 0 0 6px 3px;
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafbfc;
      padding: 12px 13px;
      outline: none;
      color: var(--navy);
      font-size: 14px;
    }

    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--pink);
      background: #fff;
    }

    .modal-actions {
      display: flex;
      gap: 9px;
      margin-top: 18px;
    }

    .modal-action {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 900;
    }

    .cancel-btn {
      background: #f1f3f6;
      color: #374151;
    }

    .save-btn {
      background: var(--pink);
      color: #fff;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      text-decoration: none;
      color: #6b7280;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-item.active {
      color: var(--pink);
    }

    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    @media (max-width: 620px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .heading-row {
        align-items: flex-start;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand-row">

      <div class="brand">
        <div class="brand-logo">R</div>
        <span>REPARO</span>
      </div>

      <button id="logoutBtn" class="logout" type="button">
        Logout
      </button>

    </div>
  </header>


  <main>

    <div class="heading-row">

      <div>
        <h1>Jobs</h1>

        <p class="subtitle">
          Service execution & technician assignment
        </p>
      </div>

    </div>


    <div id="errorBox" class="message error"></div>

    <div id="successBox" class="message success"></div>


    <section class="summary">

      <div class="summary-card">
        <div class="summary-label">Total Jobs</div>
        <div id="totalJobs" class="summary-value">0</div>
      </div>

      <div class="summary-card new">
        <div class="summary-label">New</div>
        <div id="newJobs" class="summary-value">0</div>
      </div>

      <div class="summary-card active">
        <div class="summary-label">Active</div>
        <div id="activeJobs" class="summary-value">0</div>
      </div>

      <div class="summary-card completed">
        <div class="summary-label">Completed</div>
        <div id="completedJobs" class="summary-value">0</div>
      </div>

    </section>


    <section class="management">

      <h2 class="management-title">
        Job Management
      </h2>

      <p class="management-subtitle">
        Search and manage service jobs
      </p>

      <div class="filters">

        <input
          id="searchInput"
          type="search"
          placeholder="Search Job ID, customer, mobile..."
        >

        <select id="statusFilter">

          <option value="">All Status</option>

          <option value="NEW">New</option>

          <option value="ASSIGNED">Assigned</option>

          <option value="IN PROGRESS">In Progress</option>

          <option value="DIAGNOSIS">Diagnosis</option>

          <option value="CUSTOMER APPROVAL">
            Customer Approval
          </option>

          <option value="REPAIR">Repair</option>

          <option value="COMPLETED">Completed</option>

          <option value="CANCELLED">Cancelled</option>

        </select>

      </div>

    </section>


    <section id="jobContainer">

      <div class="loading">
        Loading jobs...
      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <a
      class="nav-item"
      href="./dashboard.html"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>

    <a
      class="nav-item"
      href="./service-requests.html"
    >
      <span class="nav-icon">▣</span>
      <span>Requests</span>
    </a>

    <a
      class="nav-item active"
      href="./jobs.html"
    >
      <span class="nav-icon">🔧</span>
      <span>Jobs</span>
    </a>

    <a
      class="nav-item"
      href="./technicians.html"
    >
      <span class="nav-icon">⚙</span>
      <span>Technicians</span>
    </a>

    <a
      class="nav-item"
      href="./customers.html"
    >
      <span class="nav-icon">●</span>
      <span>Customers</span>
    </a>

  </nav>


  <!-- VIEW / EDIT JOB MODAL -->

  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <div class="modal-head">

        <h2 id="modalTitle">
          Job Details
        </h2>

        <button
          id="closeModalBtn"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <div id="modalContent" class="modal-content"></div>


      <div class="modal-actions">

        <button
          id="cancelModalBtn"
          class="modal-action cancel-btn"
          type="button"
        >
          Close
        </button>

        <button
          id="saveJobBtn"
          class="modal-action save-btn"
          type="button"
        >
          Save Changes
        </button>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="../js/jobs.js"
  ></script>

</body>
</html>
