<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - REPARO V1</title>
  <link rel="stylesheet" href="../css/reparo.css">
</head>

<body>

  <main class="page-container">

    <div class="page-header">
      <div>
        <h1>Jobs</h1>
        <p>Service execution management</p>
      </div>
    </div>

    <section class="summary-grid">

      <div class="summary-card">
        <span>Total</span>
        <strong id="totalJobs">0</strong>
      </div>

      <div class="summary-card">
        <span>New</span>
        <strong id="newJobs">0</strong>
      </div>

      <div class="summary-card">
        <span>Active</span>
        <strong id="activeJobs">0</strong>
      </div>

      <div class="summary-card">
        <span>Completed</span>
        <strong id="completedJobs">0</strong>
      </div>

    </section>

    <section class="filter-bar">

      <input
        type="search"
        id="searchInput"
        placeholder="Search Job ID, customer, mobile..."
      >

      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="NEW">New</option>
        <option value="ASSIGNED">Assigned</option>
        <option value="IN PROGRESS">In Progress</option>
        <option value="DIAGNOSIS">Diagnosis</option>
        <option value="CUSTOMER APPROVAL">Customer Approval</option>
        <option value="REPAIR">Repair</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>

    </section>

    <div id="loading">
      Loading jobs...
    </div>

    <section id="jobList"></section>

  </main>


  <!-- EDIT JOB MODAL -->

  <div id="jobModal" class="modal hidden">

    <div class="modal-content">

      <h2>Edit Job</h2>

      <form id="jobForm">

        <input
          type="hidden"
          id="editJobId"
        >

        <label>Job Status</label>

        <select id="jobStatus">
          <option value="NEW">NEW</option>
          <option value="ASSIGNED">ASSIGNED</option>
          <option value="IN PROGRESS">IN PROGRESS</option>
          <option value="DIAGNOSIS">DIAGNOSIS</option>
          <option value="CUSTOMER APPROVAL">
            CUSTOMER APPROVAL
          </option>
          <option value="REPAIR">REPAIR</option>
          <option value="COMPLETED">COMPLETED</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>


        <label>Assign Technician</label>

        <select id="technicianSelect">
          <option value="">
            -- Select Technician --
          </option>
        </select>


        <label>Admin Notes</label>

        <textarea
          id="adminNotes"
          placeholder="Internal job notes..."
        ></textarea>


        <div class="modal-actions">

          <button
            type="button"
            id="closeModalBtn">
            Cancel
          </button>

          <button
            type="submit"
            class="primary-btn">
            Save Job
          </button>

        </div>

      </form>

    </div>

  </div>


  <script
    type="module"
    src="../js/jobs.js">
  </script>

</body>
</html>
