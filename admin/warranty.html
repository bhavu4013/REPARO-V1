<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Warranty Management | REPARO V1</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #f8fafc;
      color: #172033;
      font-family: Arial, sans-serif;
      margin: 0;
      padding-bottom: 90px;
    }

    .page {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      color: #64748b;
      font-size: 13px;
      margin-top: 3px;
    }

    .logout {
      border: 0;
      background: #172033;
      color: white;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    .summary-label {
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 800;
      margin-top: 5px;
    }

    .hold-value {
      color: #d97706;
    }

    .released-value {
      color: #059669;
    }

    .search-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .search-box input,
    .search-box select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      background: #f8fafc;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .search-box input:focus,
    .search-box select:focus {
      border-color: #ec4899;
      background: white;
    }

    .warranty-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.07);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .warranty-id {
      font-weight: 800;
      font-size: 15px;
    }

    .customer {
      font-weight: 700;
      margin-top: 4px;
    }

    .device {
      color: #64748b;
      font-size: 13px;
      margin-top: 3px;
    }

    .status {
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-hold {
      background: #fef3c7;
      color: #92400e;
    }

    .status-released {
      background: #d1fae5;
      color: #065f46;
    }

    .status-paid {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-adjusted {
      background: #e0e7ff;
      color: #3730a3;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .info-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px;
    }

    .info-label {
      color: #64748b;
      font-size: 10px;
    }

    .info-value {
      font-weight: 700;
      font-size: 13px;
      margin-top: 3px;
    }

    .warranty-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 14px 0;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 11px;
      font-size: 12px;
      font-weight: 800;
    }

    .view-btn {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .release-btn {
      background: #ec4899;
      color: white;
    }

    .release-btn:disabled {
      opacity: 0.5;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #d1fae5;
      color: #065f46;
    }

    .loading,
    .empty {
      background: white;
      border-radius: 18px;
      padding: 30px 18px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .empty-title {
      color: #172033;
      font-weight: 800;
    }

    .empty-text {
      font-size: 13px;
      margin-top: 4px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 700px;
      max-height: 88vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
    }

    .close-btn {
      border: 0;
      background: #f1f5f9;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }

    .detail-label {
      color: #64748b;
    }

    .detail-value {
      font-weight: 700;
      text-align: right;
    }

    .modal-actions {
      margin-top: 18px;
      display: flex;
      gap: 8px;
    }

    .modal-actions button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
    }

    .cancel-btn {
      background: #f1f5f9;
      color: #334155;
    }

    .confirm-release-btn {
      background: #ec4899;
      color: white;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #e2e8f0;
      height: 68px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 500;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      padding: 8px;
    }

    .nav-item.active {
      color: #ec4899;
    }

    @media (min-width: 640px) {
      .summary-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .modal-backdrop {
        align-items: center;
      }

      .modal {
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">
      <div>
        <div class="title">Warranty</div>
        <div class="subtitle">Warranty & commission hold management</div>
      </div>

      <button id="logoutBtn" class="logout">Logout</button>
    </header>

    <div id="errorBox" class="message error"></div>
    <div id="successBox" class="message success"></div>

    <section class="summary-grid">

      <div class="summary-card">
        <div class="summary-label">Total</div>
        <div id="totalWarranty" class="summary-value">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Active Warranty</div>
        <div id="activeWarranty" class="summary-value">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Commission Hold</div>
        <div id="holdWarranty" class="summary-value hold-value">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Released</div>
        <div id="releasedWarranty" class="summary-value released-value">0</div>
      </div>

    </section>

    <section class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="Search Job, Customer, Mobile..."
      >

      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="WARRANTY HOLD">Warranty Hold</option>
        <option value="RELEASED">Released</option>
        <option value="PAID">Paid</option>
        <option value="CANCELLED">Cancelled</option>
        <option value="ADJUSTED">Adjusted</option>
      </select>

    </section>

    <section id="warrantyContainer">
      <div class="loading">Loading warranty records...</div>
    </section>

  </main>

  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <div class="modal-header">
        <div id="modalTitle" class="modal-title">
          Warranty Details
        </div>

        <button id="closeModalBtn" class="close-btn">×</button>
      </div>

      <div id="modalContent"></div>

      <div id="modalActions" class="modal-actions">
        <button id="cancelModalBtn" class="cancel-btn">
          Close
        </button>

        <button id="confirmReleaseBtn" class="confirm-release-btn">
          Release Commission
        </button>
      </div>

    </div>

  </div>

  <nav class="bottom-nav">

    <button class="nav-item" onclick="window.location.href='./dashboard.html'">
      🏠<br>Dashboard
    </button>

    <button class="nav-item" onclick="window.location.href='./jobs.html'">
      🔧<br>Jobs
    </button>

    <button class="nav-item active">
      🛡️<br>Warranty
    </button>

    <button class="nav-item" onclick="window.location.href='./commissions.html'">
      ₹<br>Commission
    </button>

    <button class="nav-item" onclick="window.location.href='./reports.html'">
      📊<br>Reports
    </button>

  </nav>

  <script type="module" src="../js/warranty.js"></script>

</body>
</html>
