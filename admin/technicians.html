<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F9547C">

  <title>Technicians - REPARO V1</title>

  <link rel="stylesheet" href="../css/reparo.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #F6F8FB;
      color: #111827;
      font-family: Arial, sans-serif;
      padding-bottom: 90px;
    }

    .page {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 16px 30px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .header-left h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
    }

    .header-left p {
      margin: 5px 0 0;
      color: #6B7280;
      font-size: 13px;
    }

    .add-btn {
      border: none;
      background: #F9547C;
      color: white;
      font-weight: 700;
      border-radius: 14px;
      padding: 12px 15px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(249, 84, 124, .20);
    }

    .search-wrap {
      margin-bottom: 18px;
    }

    .search-input {
      width: 100%;
      border: 1px solid #E5E7EB;
      background: white;
      border-radius: 15px;
      padding: 14px 15px;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #F9547C;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 17px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 7px 22px rgba(17, 24, 39, .06);
    }

    .summary-number {
      font-size: 21px;
      font-weight: 800;
    }

    .summary-label {
      color: #6B7280;
      font-size: 11px;
      margin-top: 4px;
    }

    .technician-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 25px rgba(17, 24, 39, .07);
    }

    .technician-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .technician-main {
      min-width: 0;
    }

    .technician-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .technician-detail {
      color: #6B7280;
      font-size: 13px;
      line-height: 1.65;
      word-break: break-word;
    }

    .status {
      flex-shrink: 0;
      height: fit-content;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
    }

    .status.active {
      background: #DCFCE7;
      color: #166534;
    }

    .status.inactive {
      background: #FEE2E2;
      color: #991B1B;
    }

    .technician-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid #F0F1F3;
    }

    .job-count {
      font-size: 12px;
      color: #6B7280;
    }

    .job-count strong {
      color: #111827;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .action-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .edit-btn {
      background: #E0F7FF;
      color: #087EA4;
    }

    .toggle-btn {
      background: #FFF4B8;
      color: #665800;
    }

    .message {
      background: white;
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      color: #6B7280;
      box-shadow: 0 7px 22px rgba(17, 24, 39, .05);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, .50);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 25px 25px 0 0;
      padding: 20px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #F6F8FB;
      font-size: 22px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .form-control {
      width: 100%;
      border: 1px solid #E5E7EB;
      background: white;
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: #F9547C;
    }

    .form-control:disabled {
      background: #F3F4F6;
      color: #6B7280;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 75px;
    }

    .required {
      color: #F9547C;
    }

    .pin-note {
      color: #6B7280;
      font-size: 11px;
      margin-top: 5px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px;
      border-radius: 13px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-btn {
      background: #F1F3F5;
      color: #374151;
    }

    .save-btn {
      background: #F9547C;
      color: white;
    }

    .save-btn:disabled {
      opacity: .6;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #EAECEF;
      display: flex;
      justify-content: center;
      z-index: 5000;
      box-shadow: 0 -5px 20px rgba(17, 24, 39, .05);
    }

    .nav-inner {
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      text-decoration: none;
      color: #6B7280;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    .nav-item.active {
      color: #F9547C;
    }

    @media (min-width: 600px) {
      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-box {
        border-radius: 25px;
        max-height: 90vh;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <div class="header-left">
        <h1>Technicians</h1>
        <p>Manage service technicians</p>
      </div>

      <button class="add-btn" id="addTechnicianBtn">
        + Add
      </button>
    </div>

    <div class="search-wrap">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search technician..."
      >
    </div>

    <div class="summary">

      <div class="summary-card">
        <div id="totalCount" class="summary-number">0</div>
        <div class="summary-label">Total</div>
      </div>

      <div class="summary-card">
        <div id="activeCount" class="summary-number">0</div>
        <div class="summary-label">Active</div>
      </div>

      <div class="summary-card">
        <div id="inactiveCount" class="summary-number">0</div>
        <div class="summary-label">Inactive</div>
      </div>

    </div>

    <div id="technicianList">
      <div class="message">
        Loading technicians...
      </div>
    </div>

  </div>


  <!-- ADD / EDIT MODAL -->

  <div id="technicianModal" class="modal">

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="modalTitle">Add Technician</h2>

        <button
          class="close-btn"
          id="closeModalBtn"
          type="button"
        >
          ×
        </button>

      </div>

      <form id="technicianForm">

        <div class="form-group">

          <label>
            Technician Name
            <span class="required">*</span>
          </label>

          <input
            id="technicianName"
            class="form-control"
            type="text"
            placeholder="Enter full name"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Mobile Number
            <span class="required">*</span>
          </label>

          <input
            id="technicianMobile"
            class="form-control"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            placeholder="10 digit mobile number"
            required
          >

          <div class="pin-note">
            Mobile number is used as Technician login ID.
          </div>

        </div>


        <div class="form-group">

          <label>
            6 Digit PIN
            <span class="required">*</span>
          </label>

          <input
            id="technicianPin"
            class="form-control"
            type="password"
            inputmode="numeric"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            placeholder="Enter 6 digit PIN"
          >

          <div class="pin-note">
            Technician will login using this mobile number and 6 digit PIN.
          </div>

        </div>


        <div class="form-group">

          <label>Service Area</label>

          <input
            id="technicianArea"
            class="form-control"
            type="text"
            placeholder="Example: Surat City"
          >

        </div>


        <div class="form-group">

          <label>Notes</label>

          <textarea
            id="technicianNotes"
            class="form-control"
            placeholder="Optional notes"
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="cancel-btn"
            id="cancelBtn"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="save-btn"
            id="saveBtn"
          >
            Create Technician
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="bottom-nav">

    <div class="nav-inner">

      <a href="./dashboard.html" class="nav-item">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>

      <a href="./retailers.html" class="nav-item">
        <span class="nav-icon">▣</span>
        <span>Retailers</span>
      </a>

      <a href="./technicians.html" class="nav-item active">
        <span class="nav-icon">⚙</span>
        <span>Technicians</span>
      </a>

      <a href="./customers.html" class="nav-item">
        <span class="nav-icon">◉</span>
        <span>Customers</span>
      </a>

    </div>

  </div>


  <!-- ONLY JS FILE -->

  <script type="module" src="../js/technicians.js"></script>

</body>
</html>
