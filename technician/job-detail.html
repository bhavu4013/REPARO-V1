<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Job Detail | REPARO</title>

  <link rel="stylesheet" href="../css/reparo.css">

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .page {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      border: 0;
      background: #fff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20,30,60,.06);
    }

    .page-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .job-id {
      margin-top: 3px;
      color: #7b8494;
      font-size: 12px;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 11px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    #errorBox {
      background: #fff0f1;
      color: #c62845;
    }

    #successBox {
      background: #e8f8ef;
      color: #187a48;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(20,30,60,.06);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .status-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 7px 11px;
      font-size: 11px;
      font-weight: 800;
    }

    .status-new {
      background: #fff3c4;
      color: #8b6900;
    }

    .status-assigned {
      background: #e9f1ff;
      color: #2863c7;
    }

    .status-progress {
      background: #e9f1ff;
      color: #2863c7;
    }

    .status-diagnosis {
      background: #f0eaff;
      color: #6842c8;
    }

    .status-approval {
      background: #fff0d9;
      color: #b56a00;
    }

    .status-repair {
      background: #ffe9ef;
      color: #d82f58;
    }

    .status-completed {
      background: #e5f8ed;
      color: #16834a;
    }

    .status-cancelled {
      background: #f0f1f3;
      color: #747b87;
    }

    .progress-line {
      margin-top: 14px;
      display: flex;
      gap: 4px;
    }

    .progress-step {
      height: 5px;
      flex: 1;
      border-radius: 5px;
      background: #e9ecf2;
    }

    .progress-step.done {
      background: #d82f58;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f2f5;
      font-size: 13px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: #7a8495;
    }

    .info-value {
      color: #263146;
      font-weight: 700;
      text-align: right;
      max-width: 65%;
      word-break: break-word;
    }

    .form-field {
      margin-bottom: 13px;
    }

    .form-field:last-child {
      margin-bottom: 0;
    }

    .form-field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #596477;
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #dfe4ec;
      background: #fafbfe;
      border-radius: 11px;
      padding: 11px;
      font-size: 14px;
      outline: none;
    }

    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .total-box {
      margin-top: 12px;
      padding: 13px;
      border-radius: 13px;
      background: #fff0f3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      font-size: 12px;
      color: #7b5260;
    }

    .total-value {
      color: #d82f58;
      font-size: 20px;
      font-weight: 800;
    }

    .action-area {
      position: sticky;
      bottom: 10px;
      z-index: 20;
      background: rgba(247,248,252,.94);
      padding-top: 8px;
    }

    .primary-btn,
    .secondary-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-btn {
      background: #d82f58;
      color: #fff;
    }

    .secondary-btn {
      background: #fff;
      color: #d82f58;
      border: 1px solid #f1c5d0;
    }

    .primary-btn:disabled,
    .secondary-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .approval-box {
      padding: 12px;
      border-radius: 13px;
      background: #fff8e8;
      color: #895f00;
      font-size: 13px;
      line-height: 1.5;
    }

    .approval-box.approved {
      background: #e8f8ef;
      color: #187a48;
    }

    .approval-box.rejected {
      background: #fff0f1;
      color: #c62845;
    }

    .loading {
      background: #fff;
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: #70798a;
    }

    .locked-box {
      padding: 12px;
      border-radius: 13px;
      background: #f3f4f6;
      color: #697386;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (min-width: 600px) {
      .page {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="topbar">

      <button
        id="backBtn"
        class="back-btn"
        type="button"
      >
        ‹
      </button>

      <div>

        <h1 class="page-title">
          Job Detail
        </h1>

        <div
          id="headerJobId"
          class="job-id"
        >
          Loading...
        </div>

      </div>

    </div>


    <div
      id="errorBox"
      class="message"
    ></div>


    <div
      id="successBox"
      class="message"
    ></div>


    <div id="pageContainer">

      <div class="loading">
        Loading job...
      </div>

    </div>

  </main>


  <script
    type="module"
    src="../js/technician-job-detail.js"
  ></script>

</body>
</html>
