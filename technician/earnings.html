<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Earnings - REPARO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f8fc;
            color: #172033;
            font-family: Arial, sans-serif;
            padding-bottom: 80px;
        }

        .header {
            background: #ffffff;
            padding: 18px 16px;
            border-bottom: 1px solid #eceef4;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
        }

        .subtitle {
            color: #7a8191;
            font-size: 13px;
            margin-top: 4px;
        }

        .logout-btn {
            border: 0;
            background: #fff0f3;
            color: #e83e61;
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: 700;
        }

        .container {
            padding: 16px;
            max-width: 700px;
            margin: auto;
        }

        .main-card {
            background: #172033;
            color: white;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 25px rgba(23, 32, 51, 0.14);
        }

        .main-label {
            font-size: 13px;
            opacity: 0.75;
        }

        .main-value {
            font-size: 32px;
            font-weight: 800;
            margin-top: 7px;
        }

        .main-note {
            font-size: 12px;
            opacity: 0.65;
            margin-top: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .stat-label {
            font-size: 12px;
            color: #7b8290;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            margin-top: 7px;
        }

        .pending {
            color: #d08b00;
        }

        .payable {
            color: #1776d2;
        }

        .paid {
            color: #159447;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 22px 0 12px;
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        .filter-btn {
            flex: 0 0 auto;
            border: 1px solid #e2e5ec;
            background: white;
            color: #555d6d;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .filter-btn.active {
            background: #e83e61;
            color: white;
            border-color: #e83e61;
        }

        .earning-card {
            background: #ffffff;
            border-radius: 17px;
            padding: 16px;
            margin-bottom: 11px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .earning-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .job-id {
            font-size: 14px;
            font-weight: 800;
        }

        .earning-date {
            font-size: 11px;
            color: #8b92a0;
            margin-top: 4px;
        }

        .amount {
            font-size: 20px;
            font-weight: 800;
            white-space: nowrap;
        }

        .earning-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .info-label {
            color: #8b92a0;
            font-size: 11px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 700;
            margin-top: 3px;
        }

        .status {
            display: inline-block;
            margin-top: 13px;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .status-pending {
            background: #fff5d9;
            color: #a76c00;
        }

        .status-payable {
            background: #e8f3ff;
            color: #176bb6;
        }

        .status-paid {
            background: #e8f8ef;
            color: #148344;
        }

        .status-hold {
            background: #fff0f0;
            color: #c23a3a;
        }

        .empty {
            background: white;
            border-radius: 16px;
            padding: 28px 16px;
            text-align: center;
            color: #858c99;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #7c8391;
        }

        .error {
            background: #fff0f1;
            color: #bd304b;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 64px;
            background: white;
            border-top: 1px solid #e8eaf0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }

        .nav-item {
            text-decoration: none;
            color: #7d8492;
            font-size: 11px;
            text-align: center;
            font-weight: 700;
        }

        .nav-item span {
            display: block;
            font-size: 21px;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #e83e61;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-row">
            <div>
                <div class="title">My Earnings</div>
                <div class="subtitle" id="technicianName">Technician</div>
            </div>

            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main class="container">

        <div id="errorBox" class="error" style="display:none;"></div>

        <section class="main-card">
            <div class="main-label">Total Earnings</div>
            <div class="main-value" id="totalEarnings">₹0</div>
            <div class="main-note">All technician earnings</div>
        </section>

        <section class="stats">

            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value pending" id="pendingAmount">₹0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Payable</div>
                <div class="stat-value payable" id="payableAmount">₹0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Paid</div>
                <div class="stat-value paid" id="paidAmount">₹0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Completed Jobs</div>
                <div class="stat-value" id="completedJobs">0</div>
            </div>

        </section>

        <div class="section-title">Earning History</div>

        <div class="filters">
            <button class="filter-btn active" data-filter="ALL">All</button>
            <button class="filter-btn" data-filter="PENDING">Pending</button>
            <button class="filter-btn" data-filter="PAYABLE">Payable</button>
            <button class="filter-btn" data-filter="PAID">Paid</button>
        </div>

        <div id="loading" class="loading">
            Loading earnings...
        </div>

        <div id="earningList"></div>

    </main>

    <nav class="bottom-nav">

        <a href="./dashboard.html" class="nav-item">
            <span>⌂</span>
            Home
        </a>

        <a href="./jobs.html" class="nav-item">
            <span>▣</span>
            Jobs
        </a>

        <a href="./earnings.html" class="nav-item active">
            <span>₹</span>
            Earnings
        </a>

        <a href="./profile.html" class="nav-item">
            <span>●</span>
            Profile
        </a>

    </nav>

    <script type="module" src="../js/technician-earnings.js"></script>

</body>
</html>
