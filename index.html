<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REPARO Login</title>

    <link rel="stylesheet" href="./css/reparo.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-page {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;
            height: 50px;
            border: 1px solid #cbd5e1;
            border-radius: 13px;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
        }

        .field input:focus {
            border-color: #e11d48;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background: #e11d48;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .error-box {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            background: #fff1f2;
            color: #be123c;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-info {
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">REPARO</div>

        <div class="subtitle">
            Service Management Portal
        </div>

        <form id="loginForm">

            <!-- Mobile -->
            <div class="field">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    id="mobile"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="tel"
                    maxlength="10"
                    minlength="10"
                    pattern="[0-9]{10}"
                    placeholder="Enter 10 digit mobile number"
                    required
                >

            </div>


            <!-- PIN -->
            <div class="field">

                <label for="pin">
                    6 Digit PIN
                </label>

                <input
                    id="pin"
                    type="password"
                    inputmode="numeric"
                    autocomplete="current-password"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    placeholder="Enter 6 digit PIN"
                    required
                >

            </div>


            <!-- Login -->
            <button
                id="loginBtn"
                class="login-btn"
                type="submit">

                LOGIN

            </button>

        </form>


        <!-- Error -->
        <div
            id="errorBox"
            class="error-box">
        </div>


        <div class="login-info">
            Admin • Retailer • Technician • Customer
        </div>

    </div>

</div>


<script
    type="module"
    src="./js/auth.js">
</script>

</body>
</html>
